name: Pre-release Regression

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  static:
    name: Static + Generated Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install linters
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Validate E2E scenario selectors
        run: bash test/e2e/scenarios_test.sh

      - name: Validate regression coverage index
        run: go test ./test/regression -count=1

      - name: Regenerate CRDs/manifests
        run: make -f Makefile.operator generate manifests

      - name: Regenerate Go package reference
        run: python3 docs/scripts/generate_go_package_reference.py

      - name: Check for generated drift
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make -f Makefile.operator generate manifests' and 'python3 docs/scripts/generate_go_package_reference.py'."
            git diff
            exit 1
          fi

  root-tests:
    name: Root, CLI + Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install envtest
        run: |
          export KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0 use -p path)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_ENV"

      - name: Build CLI
        run: go build -o bin/mcp-runtime ./cmd/mcp-runtime

      - name: Run CLI and golden tests
        run: go test -v -race -count=1 ./cmd/mcp-runtime ./internal/cli/... ./test/golden/...

      - name: Run root unit tests
        run: |
          module_path="$(go list -m)"
          go test -v -race -count=1 \
            $(go list ./... | grep -v -x "${module_path}/test/integration")

      - name: Run integration tests
        run: go test -v -race -timeout 30m -count=1 ./test/integration/...
        env:
          KUBEBUILDER_ASSETS: ${{ env.KUBEBUILDER_ASSETS }}

  service-tests:
    name: Sentinel Service Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One entry per services/*/go.mod, matching the CI service test loop.
        service:
          - platform-api
          - runtime-api
          - analytics-api
          - ingest
          - processor
          - mcp-gateway
          - ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run service tests
        run: go test -v -race -count=1 ./...
        working-directory: services/${{ matrix.service }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -run=^$ -bench=. -benchmem -count=1 ./test/benchmark/...

  repository-sbom:
    name: Repository SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate repository SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: mcp-runtime-repository.spdx.json

      - name: Upload repository SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-release-repository-sbom
          path: mcp-runtime-repository.spdx.json
          if-no-files-found: error

  gosec:
    name: Gosec Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1

      - name: Run gosec
        run: $(go env GOPATH)/bin/gosec ./...

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false

      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.29.1

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}"

      - name: Scan changed commits
        env:
          GITLEAKS_EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_BASE_REF: ${{ github.base_ref }}
          GITLEAKS_EVENT_BEFORE: ${{ github.event.before }}
          GITLEAKS_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITLEAKS_EVENT_NAME" == "pull_request" ]]; then
            log_opts="--first-parent --diff-merges=first-parent origin/${GITLEAKS_BASE_REF}..${GITLEAKS_SHA}"
          elif [[ "$GITLEAKS_EVENT_NAME" == "push" && "$GITLEAKS_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            log_opts="--first-parent --diff-merges=first-parent ${GITLEAKS_EVENT_BEFORE}..${GITLEAKS_SHA}"
          else
            log_opts="-1 ${GITLEAKS_SHA}"
          fi
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="$log_opts" --config .gitleaks.toml --redact --verbose .

  trivy:
    name: Trivy Repository + Image Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy repository vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: inspirations/mcp-gateway-registry
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          hide-progress: true

      - name: Upload Trivy repository SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          sarif_file: trivy-fs.sarif
          category: pre-release-trivy-fs-vuln

      - name: Trivy repository misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: trivy-misconfig.sarif
          exit-code: "0"
          skip-dirs: inspirations/mcp-gateway-registry
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          hide-progress: true

      - name: Upload Trivy misconfiguration SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          sarif_file: trivy-misconfig.sarif
          category: pre-release-trivy-fs-misconfig

      - name: Build operator image
        run: docker build --pull -f Dockerfile.operator -t mcp-runtime-operator:pre-release .

      - name: Generate operator image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: mcp-runtime-operator:pre-release
          format: spdx-json
          output: operator-image.spdx.json
          exit-code: "0"
          hide-progress: true

      - name: Upload operator image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-release-operator-image-sbom
          path: operator-image.spdx.json
          if-no-files-found: error

      - name: Trivy operator image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: mcp-runtime-operator:pre-release
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          hide-progress: true

      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          sarif_file: trivy-image.sarif
          category: pre-release-trivy-operator-image

  staging-e2e:
    name: Staging E2E (disposable VM)
    # The production install path (strict-prod setup, public TLS, bundled HTTPS
    # registry, tenants) on the disposable VM. It runs here rather than on every
    # merge; the called job holds the VM lock so only one run uses the VM.
    needs:
      - static
      - root-tests
      - service-tests
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/staging-e2e.yaml
    with:
      run-multitenancy: true
    secrets: inherit
