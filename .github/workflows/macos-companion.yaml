name: macOS Companion Build

on:
  pull_request:
    paths:
      - desktop/macos/**
      - internal/adapterd/**
      - internal/cli/adapter/**
      - hack/release/macos-adapter/**
      - .github/workflows/macos-companion.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile universal companion preview
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build CLI and native Dock app for Apple Silicon and Intel
        run: bash hack/release/macos-adapter/package.sh "${RUNNER_TEMP}/macos-adapter-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-adapter-universal-unsigned-preview
          path: ${{ runner.temp }}/macos-adapter-dist/*-unsigned-preview.zip
          if-no-files-found: error
          retention-days: 7
