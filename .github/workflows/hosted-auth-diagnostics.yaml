name: Runtime v0.6.3 CLI production acceptance

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Inspect read-only production analytics configuration
        type: boolean
        default: false
      rollout_candidate:
        description: Roll out the selected runtime-api candidate image before CLI acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the selected candidate CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 22e38651e7043548e059528686ff36bcdcf9673c
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Exercise the deployed candidate with the selected CLI
        env:
          SSHPASS: ${{ secrets.MCP_PROD_BOOTSTRAP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          MCP_IMAGE_PLATFORM: linux/amd64
          MCP_REGISTRY_PUSH_MODE: public
          DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only }}
          ROLLOUT_CANDIDATE: ${{ inputs.rollout_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test "$(git rev-parse HEAD)" = 22e38651e7043548e059528686ff36bcdcf9673c
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          known_hosts="$RUNNER_TEMP/platform-known-hosts"
          kubeconfig="$RUNNER_TEMP/platform-kubeconfig"
          tunnel_pid=""
          telemetry_pids=()
          cleanup() {
            docker logout registry.mcpruntime.org >/dev/null 2>&1 || true
            for pid in "${telemetry_pids[@]}"; do kill "$pid" 2>/dev/null || true; done
            if [[ -n "$tunnel_pid" ]]; then kill "$tunnel_pid" 2>/dev/null || true; fi
            if [[ -f "$kubeconfig" ]]; then shred -u "$kubeconfig"; fi
          }
          trap cleanup EXIT

          ssh-keyscan -T 10 -t ed25519 163.61.31.14 > "$known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:uLP3I92NNheo+MIPWs77aU11NCTK5NrZGwUV0l1QgQI'
          ssh_opts=(-o "UserKnownHostsFile=$known_hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          test "$(sshpass -e ssh "${ssh_opts[@]}" root@163.61.31.14 hostname)" = '1c4mdvegg6'
          sshpass -e scp "${ssh_opts[@]}" root@163.61.31.14:/etc/rancher/k3s/k3s.yaml "$kubeconfig"
          chmod 600 "$kubeconfig"
          grep -q 'server: https://127.0.0.1:6443' "$kubeconfig"
          sed -i 's#server: https://127.0.0.1:6443#server: https://127.0.0.1:16443#' "$kubeconfig"
          sshpass -e ssh "${ssh_opts[@]}" -o ExitOnForwardFailure=yes \
            -N -L 127.0.0.1:16443:127.0.0.1:6443 root@163.61.31.14 \
            > "$RUNNER_TEMP/platform-tunnel.log" 2>&1 &
          tunnel_pid=$!
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/16443' 2>/dev/null; then break; fi
            kill -0 "$tunnel_pid"
            sleep 1
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/16443'

          sshpass -e ssh "${ssh_opts[@]}" root@163.61.31.14 \
            'kubectl -n mcp-platform get secret mcp-ui-credentials -o jsonpath="{.data.UI_API_KEY}"' \
            | base64 -d \
            | docker login registry.mcpruntime.org --username platform-service --password-stdin
          unset SSHPASS

          export KUBECONFIG="$kubeconfig"
          if [[ "$DIAGNOSTICS_ONLY" == true ]]; then
            kubectl -n mcp-platform get configmaps -o json \
              | jq -c '[.items[] | {name:.metadata.name,sentinelIngestURL:.data.MCP_SENTINEL_INGEST_URL,legacyIngestURL:.data.MCP_ANALYTICS_INGEST_URL} | select(.sentinelIngestURL != null or .legacyIngestURL != null)]'
            kubectl -n mcp-platform get deployments -o json \
              | jq -c '[.items[] | select(.metadata.name | contains("runtime-api")) | {name:.metadata.name,image:.spec.template.spec.containers[0].image,configMaps:[.spec.template.spec.containers[0].envFrom[]?.configMapRef.name]}]'
            kubectl -n mcp-runtime get deployment mcp-runtime-operator-controller-manager -o json \
              | jq -c '{image:.spec.template.spec.containers[0].image,ingestEnv:[.spec.template.spec.containers[0].env[]? | select(.name == "MCP_SENTINEL_INGEST_URL" or .name == "MCP_ANALYTICS_INGEST_URL") | {name,value}]}'
            kubectl get services -A -o json \
              | jq -c '[.items[] | select(.metadata.name | contains("ingest")) | {namespace:.metadata.namespace,name:.metadata.name,ports:[.spec.ports[] | {name,port,targetPort}]}]'
            kubectl -n mcp-observability get services prometheus loki tempo grafana -o json \
              | jq -c '[.items[] | {name:.metadata.name,ports:[.spec.ports[].port]}]'
            for spec in 'grafana 13000:3000' 'prometheus 19090:9090' 'loki 13100:3100' 'tempo 13200:3200'; do
              read -r service ports <<< "$spec"
              kubectl -n mcp-observability port-forward "svc/$service" "$ports" \
                > "$RUNNER_TEMP/$service-port-forward.log" 2>&1 &
              telemetry_pids+=("$!")
            done
            sleep 3
            export GRAFANA_USER GRAFANA_PASSWORD
            GRAFANA_USER="$(kubectl -n mcp-observability get secret mcp-grafana-credentials -o jsonpath='{.data.GRAFANA_ADMIN_USER}' | base64 -d)"
            GRAFANA_PASSWORD="$(kubectl -n mcp-observability get secret mcp-grafana-credentials -o jsonpath='{.data.GRAFANA_ADMIN_PASSWORD}' | base64 -d)"
            python3 - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          start = int(dt.datetime(2026, 10, 6, 22, 36, tzinfo=dt.timezone.utc).timestamp())
          end = int(dt.datetime(2026, 10, 6, 22, 45, tzinfo=dt.timezone.utc).timestamp())

          def query(label, url, headers=None):
              try:
                  with urlopen(Request(url, headers=headers or {}), timeout=15) as response:
                      return json.load(response)
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  print(json.dumps({'source': label, 'error': type(error).__name__, 'http': getattr(error, 'code', None)}))
                  return None

          credential = base64.b64encode(f"{os.environ['GRAFANA_USER']}:{os.environ['GRAFANA_PASSWORD']}".encode()).decode()
          grafana = query('grafana', 'http://127.0.0.1:13000/grafana/api/datasources', {'Authorization': f'Basic {credential}'})
          if isinstance(grafana, list):
              print(json.dumps({'source': 'grafana', 'datasources': [item.get('name') for item in grafana]}))

          prometheus = query('prometheus', 'http://127.0.0.1:19090/prometheus/api/v1/query?' + urlencode({'query': 'up', 'time': start + 360}))
          if prometheus:
              targets = prometheus.get('data', {}).get('result', [])
              print(json.dumps({'source': 'prometheus', 'window': [start, end], 'targets': len(targets), 'down': [item.get('metric', {}).get('job') for item in targets if item.get('value', [None, None])[1] == '0']}))

          for namespace in ('mcp-runtime', 'mcp-platform', 'mcp-team-ait'):
              loki = query('loki', 'http://127.0.0.1:13100/loki/api/v1/query_range?' + urlencode({'query': f'{{namespace="{namespace}"}}', 'start': start * 10**9, 'end': end * 10**9, 'limit': 100}))
              if loki:
                  streams = loki.get('data', {}).get('result', [])
                  print(json.dumps({'source': 'loki', 'namespace': namespace, 'window': [start, end], 'streams': len(streams), 'entries': sum(len(item.get('values', [])) for item in streams)}))

          tempo = query('tempo', 'http://127.0.0.1:13200/api/search?' + urlencode({'start': start, 'end': end, 'limit': 20}))
          if tempo:
              traces = tempo.get('traces', [])
              print(json.dumps({'source': 'tempo', 'window': [start, end], 'traces': len(traces)}))
          PY
            unset GRAFANA_USER GRAFANA_PASSWORD
            exit 0
          fi
          make build
          ./bin/mcp-runtime cluster doctor
          if [[ "$ROLLOUT_CANDIDATE" == true ]]; then
            auth_image_before="$(kubectl -n mcp-platform get deployment mcp-auth-server -o jsonpath='{.spec.template.spec.containers[0].image}')"
            candidate_tag="v0.6.3-22e38651"
            jq -n --arg tag "$candidate_tag" \
              '{apiVersion:"mcpruntime.org/v1alpha1",kind:"PlatformRelease",version:"v0.6.3",components:[{name:"runtime-api",repository:"registry.mcpruntime.org/mcp-runtime-api",tag:$tag}]}' \
              > "$RUNNER_TEMP/runtime-api-candidate.json"
            ./bin/mcp-runtime update --to v0.6.3 \
              --release-manifest "$RUNNER_TEMP/runtime-api-candidate.json" \
              --only runtime-api --allow-downgrade --dry-run --build --source . --image-platform linux/amd64 \
              --kubeconfig "$kubeconfig" --context default
            ./bin/mcp-runtime update --to v0.6.3 \
              --release-manifest "$RUNNER_TEMP/runtime-api-candidate.json" \
              --only runtime-api --allow-downgrade --build --source . --image-platform linux/amd64 \
              --kubeconfig "$kubeconfig" --context default --yes
            test "$(kubectl -n mcp-platform get deployment mcp-auth-server -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$auth_image_before"
            ./bin/mcp-runtime cluster doctor
            echo "Rolled out selected runtime-api candidate image with tag $candidate_tag"
          fi
          export MCP_RUNTIME_CONFIG_DIR="$RUNNER_TEMP/qa-profile"
          mkdir -m 700 "$MCP_RUNTIME_CONFIG_DIR"
          admin_email="$(kubectl -n mcp-platform get secret mcp-platform-api-credentials -o jsonpath='{.data.PLATFORM_ADMIN_EMAIL}' | base64 -d)"
          admin_password="$(kubectl -n mcp-platform get secret mcp-platform-api-credentials -o jsonpath='{.data.PLATFORM_ADMIN_PASSWORD}' | base64 -d)"
          test -n "$admin_email"
          test -n "$admin_password"
          ./bin/mcp-runtime auth login --api-url https://platform.mcpruntime.org --email "$admin_email" --password "$admin_password" --profile qa-audit > /dev/null
          ./bin/mcp-runtime auth status > /dev/null
          echo 'Production CLI login passed'
          ./bin/mcp-runtime team list

          # This is the same authenticated analytics route the UI uses.
          cookie_jar="$RUNNER_TEMP/ui-cookie-jar"
          curl -fsS -c "$cookie_jar" -H 'content-type: application/json' \
            --data "$(jq -nc --arg email "$admin_email" --arg password "$admin_password" '{email:$email,password:$password}')" \
            https://platform.mcpruntime.org/auth/login \
            | jq -e '.authenticated == true and .principal.role == "admin"' >/dev/null
          curl -fsS -b "$cookie_jar" https://platform.mcpruntime.org/auth/status \
            | jq -e '.authenticated == true' >/dev/null

          qa_name="qa-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          qa_tag="v063-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          qa_dir="$RUNNER_TEMP/qa-server/.mcp"
          grant_name="$qa_name-grant"
          agent_id=""
          created_agent=false
          adapter_pid=""
          cleanup_qa() {
            if [[ -n "$grant_name" ]]; then ./bin/mcp-runtime access grant delete "$grant_name" --namespace mcp-team-ait >/dev/null 2>&1 || true; fi
            if [[ -n "$qa_name" ]]; then ./bin/mcp-runtime server delete "$qa_name" --namespace mcp-team-ait >/dev/null 2>&1 || true; fi
            if [[ "$created_agent" == true && -n "$agent_id" ]]; then ./bin/mcp-runtime agent deactivate "$agent_id" >/dev/null 2>&1 || true; fi
            if [[ -n "$adapter_pid" ]]; then kill "$adapter_pid" 2>/dev/null || true; fi
          }
          trap 'cleanup_qa; cleanup' EXIT
          mkdir -p "$qa_dir"
          ./bin/mcp-runtime server init "$qa_name" --metadata-dir "$qa_dir" --scope tenant --image "ait/$qa_name" --tag "$qa_tag" --port 8088 --tool aaa-ping --policy-mode observe --default-decision allow --session-required=false --force
          ./bin/mcp-runtime server validate --metadata-dir "$qa_dir"
          ./bin/mcp-runtime server build image "$qa_name" --metadata-dir "$qa_dir" --dockerfile examples/oauth-example-go-2025-11-25/Dockerfile --context examples/oauth-example-go-2025-11-25 --tag "$qa_tag"
          image_ref="$(awk '$1=="image:"{i=$2} $1=="imageTag:"{t=$2} END{if(i==""||t=="")exit 1; print i ":" t}' "$qa_dir/servers.yaml")"
          ./bin/mcp-runtime server push --scope tenant --image "$image_ref"
          if ! ./bin/mcp-runtime server deploy "$qa_name" --scope tenant --team ait --metadata-dir "$qa_dir"; then
            echo 'CLI deployment failed; collecting read-only resource status before cleanup'
            kubectl -n mcp-team-ait get mcpserver "$qa_name" -o json \
              | jq -c '{name:.metadata.name,image:.spec.image,phase:.status.phase,conditions:.status.conditions,message:.status.message}' || true
            kubectl -n mcp-team-ait get pods -o json \
              | jq -c --arg name "$qa_name" '[.items[] | select(.metadata.name | startswith($name)) | {name:.metadata.name,phase:.status.phase,containers:[.status.containerStatuses[]? | {name,ready,state}]}]' || true
            kubectl -n mcp-team-ait get events -o json \
              | jq -c --arg name "$qa_name" '[.items[] | select((.involvedObject.name // "") | contains($name)) | {time:(.lastTimestamp // .eventTime),object:.involvedObject.name,reason,message}] | .[-30:]' || true
            kubectl -n mcp-runtime logs deployment/mcp-runtime-operator-controller-manager --since=10m --all-containers=true \
              | grep -F "$qa_name" | tail -40 || true
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 60); do
            phase="$(kubectl -n mcp-team-ait get mcpserver "$qa_name" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            if [[ "$phase" == Ready ]]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          echo "CLI-published server is Ready: $qa_name"
          agent_id="$(./bin/mcp-runtime agent list ait --status active | awk 'NR==2{print $1}')"
          if [[ -z "$agent_id" ]]; then
            agent_output="$(./bin/mcp-runtime agent create ait --name "$qa_name")"
            agent_id="$(printf '%s' "$agent_output" | sed -n 's/.*(\(agt_[^)]*\)).*/\1/p')"
            created_agent=true
          fi
          test -n "$agent_id"
          ./bin/mcp-runtime access grant init "$grant_name" --namespace mcp-team-ait --server "$qa_name" --agent-id "$agent_id" --tool aaa-ping --expires-in 1h --output "$RUNNER_TEMP/qa-grant.yaml"
          ./bin/mcp-runtime access grant apply --file "$RUNNER_TEMP/qa-grant.yaml"
          ./bin/mcp-runtime adapter proxy --runtime-url "https://mcp.mcpruntime.org/$qa_name/mcp" --server "$qa_name" --agent "$agent_id" --auto-refresh --listen 127.0.0.1:8099 > "$RUNNER_TEMP/adapter.log" 2>&1 &
          adapter_pid=$!
          adapter_ready=false
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8099' 2>/dev/null; then adapter_ready=true; break; fi
            kill -0 "$adapter_pid"
            sleep 1
          done
          test "$adapter_ready" = true
          echo 'CLI grant and adapter started'

          mcp_url=http://127.0.0.1:8099
          response_headers="$RUNNER_TEMP/adapter-response-headers"
          response_body="$RUNNER_TEMP/adapter-response-body"
          init_status="$(curl -sS -D "$response_headers" -o "$response_body" -w '%{http_code}' \
            -H 'accept: application/json, text/event-stream' -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"qa-v063","version":"1"}}}' \
            "$mcp_url")"
          test "$init_status" = 200
          session_id="$(awk 'tolower($1)=="mcp-session-id:" {gsub("\\r", "", $2); print $2}' "$response_headers" | tail -1)"
          session_header=()
          if [[ -n "$session_id" ]]; then session_header=(-H "mcp-session-id: $session_id"); fi
          curl -fsS -o /dev/null \
            -H 'accept: application/json, text/event-stream' -H 'content-type: application/json' \
            "${session_header[@]}" \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            "$mcp_url"
          call_status="$(curl -sS -D "$response_headers" -o "$response_body" -w '%{http_code}' \
            -H 'accept: application/json, text/event-stream' -H 'content-type: application/json' \
            "${session_header[@]}" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"aaa-ping","arguments":{}}}' \
            "$mcp_url")"
          # The hosted preview can deny tool calls with missing_identity; the
          # customer guide documents that expected policy result.
          case "$call_status" in 200|401|403) ;; *) echo "Unexpected tool call HTTP $call_status" >&2; exit 1 ;; esac
          if [[ "$call_status" != 200 ]]; then
            grep -Eq 'missing_identity|tool_denied|forbidden' "$response_body"
          fi
          echo "Adapter tool call returned HTTP $call_status"

          analytics_found=false
          for attempt in $(seq 1 30); do
            curl -fsS -b "$cookie_jar" \
              "https://platform.mcpruntime.org/api/ui/v1/events?limit=100&server=$qa_name&tool_name=aaa-ping" \
              > "$RUNNER_TEMP/qa-events.json"
            if jq -e --arg server "$qa_name" \
              '[.events[]? | select(.server == $server and .tool_name == "aaa-ping")] | length > 0' \
              "$RUNNER_TEMP/qa-events.json" >/dev/null; then analytics_found=true; break; fi
            sleep 5
          done
          test "$analytics_found" = true
          jq -c --arg server "$qa_name" \
            '.events[] | select(.server == $server and .tool_name == "aaa-ping") | {server,tool_name,decision,timestamp}' \
            "$RUNNER_TEMP/qa-events.json"
          echo 'Authenticated UI analytics event passed'

          npm install --prefix "$RUNNER_TEMP/browser" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          gh api "repos/$GITHUB_REPOSITORY/contents/test/e2e/hosted-browser-check.mjs?ref=qa/v063-cli-acceptance" \
            --jq .content | base64 -d > "$RUNNER_TEMP/hosted-browser-check.mjs"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" \
            BROWSER_EVIDENCE_DIR="$RUNNER_TEMP/browser-evidence" \
            QA_NAME="$qa_name" QA_ADMIN_EMAIL="$admin_email" QA_ADMIN_PASSWORD="$admin_password" \
            node "$RUNNER_TEMP/hosted-browser-check.mjs"
          unset admin_email admin_password

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-evidence/*.png
          if-no-files-found: ignore
