name: Runtime v0.6.3 candidate rollout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: v0.6.3
      VERIFY_ONLY: false
      MCP_AUTH_VERSION: 0.4.4
    steps:
      - name: Check out the selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9b12148b1560a70beae1dd7a2c1afe8e5317fe8a
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate candidate manifest from selected source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9b12148b1560a70beae1dd7a2c1afe8e5317fe8a
          mkdir -p "$RUNNER_TEMP/release"
          go run ./hack/release/platformmanifest -version v0.6.3 > "$RUNNER_TEMP/release/platform-manifest.json"
          jq -e '.version == "v0.6.3" and (.crdChange // false) == false' "$RUNNER_TEMP/release/platform-manifest.json"

      - name: Deploy and verify Runtime from a disposable runner
        env:
          SSHPASS: ${{ secrets.MCP_PROD_BOOTSTRAP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          MCP_IMAGE_PLATFORM: linux/amd64
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test "$(git rev-parse HEAD)" = 9b12148b1560a70beae1dd7a2c1afe8e5317fe8a
          test -z "$(git status --porcelain)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          known_hosts="$RUNNER_TEMP/platform-known-hosts"
          kubeconfig="$RUNNER_TEMP/platform-kubeconfig"
          tunnel_pid=""
          cleanup() {
            docker logout registry.mcpruntime.org >/dev/null 2>&1 || true
            if [[ -n "$tunnel_pid" ]]; then kill "$tunnel_pid" 2>/dev/null || true; fi
            if [[ -f "$kubeconfig" ]]; then shred -u "$kubeconfig"; fi
          }
          trap cleanup EXIT

          ssh-keyscan -T 10 -t ed25519 163.61.31.14 > "$known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:uLP3I92NNheo+MIPWs77aU11NCTK5NrZGwUV0l1QgQI'
          ssh_opts=(-o "UserKnownHostsFile=$known_hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          test "$(sshpass -e ssh "${ssh_opts[@]}" root@163.61.31.14 hostname)" = '1c4mdvegg6'
          sshpass -e scp "${ssh_opts[@]}" root@163.61.31.14:/etc/rancher/k3s/k3s.yaml "$kubeconfig"
          chmod 600 "$kubeconfig"
          grep -q 'server: https://127.0.0.1:6443' "$kubeconfig"
          sed -i 's#server: https://127.0.0.1:6443#server: https://127.0.0.1:16443#' "$kubeconfig"
          sshpass -e ssh "${ssh_opts[@]}" -o ExitOnForwardFailure=yes \
            -N -L 127.0.0.1:16443:127.0.0.1:6443 root@163.61.31.14 \
            > "$RUNNER_TEMP/platform-tunnel.log" 2>&1 &
          tunnel_pid=$!
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/16443' 2>/dev/null; then break; fi
            kill -0 "$tunnel_pid"
            sleep 1
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/16443'

          sshpass -e ssh "${ssh_opts[@]}" root@163.61.31.14 \
            'kubectl -n mcp-platform get secret mcp-ui-credentials -o jsonpath="{.data.UI_API_KEY}"' \
            | base64 -d \
            | docker login registry.mcpruntime.org --username platform-service --password-stdin
          unset SSHPASS

          export KUBECONFIG="$kubeconfig"
          make build
          export MCP_RUNTIME_CONFIG_DIR="$RUNNER_TEMP/qa-profile"
          mkdir -m 700 "$MCP_RUNTIME_CONFIG_DIR"
          admin_email="$(kubectl -n mcp-platform get secret mcp-platform-api-credentials -o jsonpath='{.data.PLATFORM_ADMIN_EMAIL}' | base64 -d)"
          admin_password="$(kubectl -n mcp-platform get secret mcp-platform-api-credentials -o jsonpath='{.data.PLATFORM_ADMIN_PASSWORD}' | base64 -d)"
          test -n "$admin_email"
          test -n "$admin_password"
          ./bin/mcp-runtime auth login --api-url https://platform.mcpruntime.org --email "$admin_email" --password "$admin_password" --profile qa-audit > /dev/null
          unset admin_email admin_password
          ./bin/mcp-runtime auth status > /dev/null
          echo 'Production CLI login passed'
          ./bin/mcp-runtime team list

          qa_name="qa-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          qa_tag="v063-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          qa_dir="$RUNNER_TEMP/qa-server/.mcp"
          grant_name="$qa_name-grant"
          agent_id=""
          created_agent=false
          adapter_pid=""
          cleanup_qa() {
            if [[ -n "$grant_name" ]]; then ./bin/mcp-runtime access grant delete "$grant_name" --namespace mcp-team-ait >/dev/null 2>&1 || true; fi
            if [[ -n "$qa_name" ]]; then ./bin/mcp-runtime server delete "$qa_name" --namespace mcp-team-ait >/dev/null 2>&1 || true; fi
            if [[ "$created_agent" == true && -n "$agent_id" ]]; then ./bin/mcp-runtime agent deactivate "$agent_id" >/dev/null 2>&1 || true; fi
            if [[ -n "$adapter_pid" ]]; then kill "$adapter_pid" 2>/dev/null || true; fi
          }
          trap 'cleanup_qa; cleanup' EXIT
          mkdir -p "$qa_dir"
          ./bin/mcp-runtime server init "$qa_name" --metadata-dir "$qa_dir" --scope tenant --image "ait/$qa_name" --tag "$qa_tag" --port 8088 --tool aaa-ping --policy-mode observe --default-decision allow --session-required=false --force
          ./bin/mcp-runtime server validate --metadata-dir "$qa_dir"
          ./bin/mcp-runtime server build image "$qa_name" --metadata-dir "$qa_dir" --dockerfile examples/oauth-example-go-2025-11-25/Dockerfile --context examples/oauth-example-go-2025-11-25 --tag "$qa_tag"
          image_ref="$(awk '$1=="image:"{i=$2} $1=="imageTag:"{t=$2} END{if(i==""||t=="")exit 1; print i ":" t}' "$qa_dir/servers.yaml")"
          ./bin/mcp-runtime server push --scope tenant --image "$image_ref"
          ./bin/mcp-runtime server deploy "$qa_name" --scope tenant --team ait --metadata-dir "$qa_dir"
          ready=false
          for attempt in $(seq 1 60); do
            phase="$(kubectl -n mcp-team-ait get mcpserver "$qa_name" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            if [[ "$phase" == Ready ]]; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          echo "CLI-published server is Ready: $qa_name"
          agent_id="$(./bin/mcp-runtime agent list ait --status active | awk 'NR==2{print $1}')"
          if [[ -z "$agent_id" ]]; then
            agent_output="$(./bin/mcp-runtime agent create ait --name "$qa_name")"
            agent_id="$(printf '%s' "$agent_output" | sed -n 's/.*(\(agt_[^)]*\)).*/\1/p')"
            created_agent=true
          fi
          test -n "$agent_id"
          ./bin/mcp-runtime access grant init "$grant_name" --namespace mcp-team-ait --server "$qa_name" --agent-id "$agent_id" --tool aaa-ping --expires-in 1h --output "$RUNNER_TEMP/qa-grant.yaml"
          ./bin/mcp-runtime access grant apply --file "$RUNNER_TEMP/qa-grant.yaml"
          ./bin/mcp-runtime adapter proxy --runtime-url "https://mcp.mcpruntime.org/$qa_name/mcp" --server "$qa_name" --agent "$agent_id" --auto-refresh --listen 127.0.0.1:8099 > "$RUNNER_TEMP/adapter.log" 2>&1 &
          adapter_pid=$!
          adapter_ready=false
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8099' 2>/dev/null; then adapter_ready=true; break; fi
            kill -0 "$adapter_pid"
            sleep 1
          done
          test "$adapter_ready" = true
          echo 'CLI grant and adapter started'
