name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build CLI binaries
    uses: ./.github/workflows/release-build.yaml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: src

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      # platform-manifest.json is the authoritative component version list that
      # `mcp-runtime update --to <tag>` fetches. It is generated from the CLI's
      # component catalog. When config/crd/bases changed since the previous tag,
      # crdChange is set and CRD YAML is embedded in the JSON (and also written
      # as platform-crds.yaml) so update can apply schema changes.
      - name: Generate platform component manifest
        shell: bash
        working-directory: src
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crd_flag=""
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [[ -z "${previous_tag}" ]] || ! git diff --quiet "${previous_tag}" "${RELEASE_TAG}" -- config/crd/bases; then
            crd_flag="-crd-change"
          fi
          go run ./hack/release/platformmanifest \
            -version "${RELEASE_TAG}" \
            ${crd_flag} \
            -write-crds ../dist/platform-crds.yaml \
            > ../dist/platform-manifest.json
          # Always publish a standalone CRD bundle for --crds / operators.
          if [[ ! -s ../dist/platform-crds.yaml ]]; then
            go run ./hack/release/platformmanifest \
              -version "${RELEASE_TAG}" \
              -write-crds ../dist/platform-crds.yaml \
              >/dev/null
          fi
          python3 - <<'PY'
          import json
          m=json.load(open("../dist/platform-manifest.json"))
          print("version", m.get("version"), "crdChange", m.get("crdChange"), "components", len(m.get("components",[])), "crds_bytes", len(m.get("crds") or ""))
          PY

      - name: List release assets
        run: find dist -type f | sort

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            mcp-runtime-darwin-arm64
            mcp-runtime-darwin-amd64
            mcp-runtime-linux-arm64
            mcp-runtime-linux-amd64
            mcp-runtime-windows-amd64.exe
            platform-manifest.json
            platform-crds.yaml
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "dist/${asset}" ]]; then
              echo "Missing or empty release asset: ${asset}" >&2
              exit 1
            fi
          done
          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found ${actual_count}" >&2
            exit 1
          fi
          if ! python3 -c 'import json; m=json.load(open("dist/platform-manifest.json")); assert m.get("crdChange") is False or (m.get("crds") or "").strip()'; then
            echo "platform-manifest.json with crdChange must embed non-empty crds" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: MCP Runtime ${{ github.ref_name }}
          body: |
            ## Try it

            Download the `mcp-runtime` CLI binary for your platform:

            - [macOS Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-darwin-arm64)
            - [macOS Intel](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-darwin-amd64)
            - [Linux amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-linux-amd64)
            - [Linux arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-linux-arm64)
            - [Windows amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mcp-runtime-windows-amd64.exe)

            Install and setup guide: https://mcpruntime.org/docs/getting-started/
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
