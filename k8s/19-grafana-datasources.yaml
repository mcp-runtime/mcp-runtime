apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mcp-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090/prometheus
        access: proxy
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        access: proxy
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: 'trace_id=([0-9a-f]{32})'
              datasourceUid: tempo
              url: '$${__value.raw}'
              urlDisplayLabel: 'Open request trace'
