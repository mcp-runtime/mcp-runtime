apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mcp-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090/prometheus
        access: proxy
        isDefault: true
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        access: proxy
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
