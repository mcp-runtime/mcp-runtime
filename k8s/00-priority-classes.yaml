# Eviction ordering for the platform stack. When a node is under
# resource pressure the kubelet evicts lower-priority pods first, so stateful
# data stores outrank the request-serving services. These only affect
# eviction/preemption order; they do not change scheduling placement.
# The classes are cluster-scoped and shared by mcp-platform and mcp-observability.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mcp-shared-data
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Shared stateful data stores (Postgres, Kafka, ClickHouse). Evicted last."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mcp-shared-services
value: 50000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Shared request-serving services (APIs, UI, gateway, ingest, processor)."
