# Create this file from 02-secrets.yaml.example
# DO NOT commit this file - it contains real secrets
# This file is gitignored for security

# To create secrets:
# cp 02-secrets.yaml.example k8s/02-secrets.yaml
# Edit k8s/02-secrets.yaml with your actual secret values
# kubectl apply -f k8s/02-secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mcp-platform-api-credentials
  namespace: mcp-platform
type: Opaque
stringData:
  API_KEYS: "changeme"
  ADMIN_API_KEYS: "changeme"
  UI_API_KEY: "changeme"
  ADMIN_USERS: "admin@example.com"
  PLATFORM_ADMIN_EMAIL: "admin@example.com"
  PLATFORM_ADMIN_PASSWORD: "changeme"
  PLATFORM_DEV_LOGIN_ENABLED: "false"
  PLATFORM_DEV_USER_EMAIL: "test@mcpruntime.org"
  PLATFORM_DEV_USER_PASSWORD: "changeme"
  PLATFORM_DEV_ADMIN_EMAIL: "admin@mcpruntime.org"
  PLATFORM_DEV_ADMIN_PASSWORD: "changeme"
  POSTGRES_DSN: "postgres://mcp_runtime:changeme@mcp-postgres.mcp-platform.svc.cluster.local:5432/mcp_runtime?sslmode=disable"
  JWT_SECRET: "changeme"
  INTERNAL_AUTH_TOKEN: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-ui-credentials
  namespace: mcp-platform
type: Opaque
stringData:
  UI_API_KEY: "changeme"
  ADMIN_API_KEYS: "changeme"
  UI_SESSION_DATABASE_URL: "postgres://mcp_runtime:changeme@mcp-postgres.mcp-platform.svc.cluster.local:5432/mcp_runtime?sslmode=disable"
  UI_SESSION_ENCRYPTION_KEY: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-postgres-credentials
  namespace: mcp-platform
type: Opaque
stringData:
  POSTGRES_USER: "mcp_runtime"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "mcp_runtime"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-ingest-credentials
  namespace: mcp-observability
type: Opaque
stringData:
  INGEST_API_KEYS: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-grafana-credentials
  namespace: mcp-observability
type: Opaque
stringData:
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "changeme"
