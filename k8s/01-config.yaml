apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-shared-config
  namespace: mcp-platform
data:
  CLICKHOUSE_ADDR: "clickhouse.mcp-observability.svc.cluster.local:9000"
  CLICKHOUSE_DB: "mcp"
  KAFKA_BROKERS: "kafka.mcp-observability.svc.cluster.local:9092"
  KAFKA_TOPIC: "mcp.events"
  MCP_ANALYTICS_INGEST_URL: "http://mcp-ingest.mcp-observability.svc.cluster.local:8081/events"
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""
  GOOGLE_CLIENT_ID: ""
  PLATFORM_MODE: "tenant"
  # Existing enterprise cert-manager ClusterIssuer used for workload mTLS.
  # Setup fills this from --mtls-cluster-issuer.
  MCP_MTLS_CLUSTER_ISSUER: ""
  MCP_TRUST_DOMAIN: ""
  PLATFORM_ORG_NAMESPACE: "mcp-servers-org"
  PLATFORM_PUBLIC_NAMESPACE: "mcp-servers-public"
  PLATFORM_MCP_ACTIVE_SERVER_LIMIT: "5"
  PLATFORM_MCP_PUSH_COOLDOWN: "0s"
  PLATFORM_REGISTRY_URL: ""
  PLATFORM_TRAEFIK_NAMESPACE: ""
  PLATFORM_TEAM_TRAEFIK_WATCH: ""
  MCP_REGISTRY_ENDPOINT: ""
  MCP_REGISTRY_INGRESS_HOST: ""
  MCP_PLATFORM_DOMAIN: ""
  # First-party MCP OAuth authorization server issuer. Setup derives this from
  # the public platform host; keep the local value for path-based dev ingress.
  OAUTH_ISSUER_URL: ""
  # Optional local interoperability extension for native clients such as Cursor.
  # Keep empty in production; MCP redirect URIs should be HTTPS or loopback HTTP.
  OAUTH_ALLOWED_REDIRECT_URI_SCHEMES: ""
  # Optional in-cluster backchannel for gateway discovery/JWKS fetches.
  OAUTH_INTERNAL_ISSUER_URL: ""
  MCP_MCP_INGRESS_HOST: ""
  API_BASE: "/api/v1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.mcp-observability.svc:4318"
  MCP_CLUSTER_NAME: "local"
  # Dashboard observability links
  GRAFANA_URL: "/grafana"
  PROMETHEUS_API_URL: "http://prometheus.mcp-observability.svc:9090/prometheus"
  DASHBOARD_REFRESH_INTERVAL: "30"
