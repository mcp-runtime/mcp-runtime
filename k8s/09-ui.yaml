apiVersion: v1
kind: Service
metadata:
  name: mcp-ui
  namespace: mcp-platform
spec:
  selector:
    app: mcp-ui
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ui
  namespace: mcp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-ui
  template:
    metadata:
      labels:
        app: mcp-ui
    spec:
      priorityClassName: mcp-shared-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: mcp-ui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mcp-shared-config
          env:
            - name: PORT
              value: "8082"
            - name: UI_SESSION_STORE
              value: postgres
            - name: UI_SESSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-ui-credentials
                  key: UI_SESSION_DATABASE_URL
            - name: UI_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-ui-credentials
                  key: UI_SESSION_ENCRYPTION_KEY
            - name: API_BASE
              valueFrom:
                configMapKeyRef:
                  name: mcp-shared-config
                  key: API_BASE
            - name: API_UPSTREAM
              value: "http://mcp-platform-api.mcp-platform.svc.cluster.local:8080"
            - name: RUNTIME_UPSTREAM
              value: "http://mcp-runtime-api.mcp-platform.svc.cluster.local:8084"
            - name: ANALYTICS_UPSTREAM
              value: "http://mcp-analytics-api.mcp-observability.svc.cluster.local:8085"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-ui-credentials
                  key: UI_API_KEY
            - name: ADMIN_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: mcp-ui-credentials
                  key: ADMIN_API_KEYS
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: mcp-ui
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 20
