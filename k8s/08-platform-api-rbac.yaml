apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-platform-api
  namespace: mcp-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-platform-api-user-key-secret
  namespace: mcp-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-user-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-platform-api-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-platform-api-user-key-secret
  namespace: mcp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-platform-api-user-key-secret
subjects:
  - kind: ServiceAccount
    name: mcp-platform-api
    namespace: mcp-platform
---
# Gateways may run in any managed tenant namespace. Read only the live bound
# workload controller chain and current grant; no list/watch, broad Secret
# reads, or tenant mutations. Exact Secret GET requires explicit source RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-platform-api-gateway-identity
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpservers", "mcpaccessgrants"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-platform-api-gateway-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-platform-api-gateway-identity
subjects:
  - kind: ServiceAccount
    name: mcp-platform-api
    namespace: mcp-platform
