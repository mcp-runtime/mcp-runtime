apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-platform-api
  namespace: mcp-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-platform-api-user-key-secret
  namespace: mcp-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-user-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-platform-api-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-platform-api-user-key-secret
  namespace: mcp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-platform-api-user-key-secret
subjects:
  - kind: ServiceAccount
    name: mcp-platform-api
    namespace: mcp-platform
