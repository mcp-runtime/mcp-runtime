# The collector sends a credential only after matching a live node UID and
# InternalIP to setup-provisioned serving trust. Kubernetes NetworkPolicy cannot
# select Node objects. Setup and update derive exact host CIDRs/TCP 10250 from
# that trust and current nodes; the static template permits no destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-runtime-api-resource-history-egress
  namespace: mcp-platform
spec:
  podSelector:
    matchLabels:
      app: mcp-runtime-api
  policyTypes: [Egress]
  egress: []
