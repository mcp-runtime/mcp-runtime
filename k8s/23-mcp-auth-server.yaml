apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: mcp-auth-server-strip-prefix, namespace: mcp-platform}
spec:
  stripPrefix:
    prefixes: [/mcp-auth]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-auth-server
  namespace: mcp-platform
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp-auth-server}}
  template:
    metadata: {labels: {app: mcp-auth-server}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auth-server
          image: docker.io/princekrroshan01/mcp-auth-server:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: MCP_AUTH_ISSUER, value: "MCP_AUTH_ISSUER_VALUE"}
            # Plural wins in the authorization server when both are set. The
            # singular is kept for compatibility with an older image that only
            # reads MCP_AUTH_RESOURCE; it carries the first resource so such an
            # image still serves at least one.
            - {name: MCP_AUTH_RESOURCES, value: MCP_AUTH_RESOURCES_VALUE}
            - {name: MCP_AUTH_RESOURCE, value: MCP_AUTH_RESOURCE_VALUE}
            - {name: MCP_AUTH_LISTEN_ADDR, value: ":8080"}
            - {name: MCP_AUTH_LOCAL_DEVELOPMENT, value: "MCP_AUTH_LOCAL_DEVELOPMENT_VALUE"}
            - {name: MCP_AUTH_LOCAL_TOKEN_EXCHANGE, value: "MCP_AUTH_LOCAL_TOKEN_EXCHANGE_VALUE"}
            - {name: MCP_AUTH_LOCAL_CLIENT_ID, value: mcp-auth-sdk-client}
            - {name: MCP_AUTH_REGISTRATION_ENABLED, value: "true"}
            - {name: MCP_AUTH_REQUIRE_HTTPS, value: "MCP_AUTH_REQUIRE_HTTPS_VALUE"}
            # Traefik terminates TLS and this pod listens plaintext, so the
            # only evidence of HTTPS is X-Forwarded-Proto. That header is
            # client-supplied, so the server ignores it unless we declare
            # here that a trusted proxy fronts us. The declaration is only
            # honest because mcp-auth-server-ingress below makes the ingress
            # controller the only route to this pod.
            - {name: MCP_AUTH_TRUST_PROXY_TLS, value: "MCP_AUTH_TRUST_PROXY_TLS_VALUE"}
            - {name: MCP_AUTH_STORE, value: MCP_AUTH_STORE_VALUE}
            - {name: MCP_AUTH_DATABASE_URL, value: MCP_AUTH_DATABASE_URL_VALUE}
            MCP_AUTH_SIGNING_KEY_ENV_BLOCK
            MCP_AUTH_CONNECTOR_ENV_BLOCK
          envFrom:
            MCP_AUTH_CONNECTOR_ENVFROM_BLOCK
          volumeMounts:
            - name: data
              mountPath: /data
            MCP_AUTH_SIGNING_KEY_VOLUME_MOUNT_BLOCK
            MCP_AUTH_CONNECTOR_VOLUME_MOUNT_BLOCK
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: data
          MCP_AUTH_DATA_VOLUME_BLOCK
        MCP_AUTH_SIGNING_KEY_POD_VOLUME_BLOCK
        MCP_AUTH_CONNECTOR_POD_VOLUME_BLOCK
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-auth-server-data
  namespace: mcp-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-auth-server
  namespace: mcp-platform
spec:
  selector: {app: mcp-auth-server}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-auth-server
  namespace: mcp-platform
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mcp-platform-mcp-auth-server-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
# Rendered by internal/cli/setup/platform/mcp_auth_server.go. The placeholder
# starts at column 0 and owns its whole line: the renderer supplies the block's
# own indentation, and drops the entire line in test mode. Do not indent it.
MCP_AUTH_INGRESS_TLS_BLOCK
  rules:
    - host: MCP_AUTH_INGRESS_HOST_VALUE
      http:
        paths:
          - path: /mcp-auth
            pathType: Prefix
            backend: {service: {name: mcp-auth-server, port: {number: 8080}}}
          # The authorization server serves these itself (RFC 8414 section 3.1
          # for a path-mounted issuer); Traefik only has to route them to it.
          - path: /.well-known/oauth-authorization-server/mcp-auth
            pathType: Exact
            backend: {service: {name: mcp-auth-server, port: {number: 8080}}}
          - path: /.well-known/openid-configuration/mcp-auth
            pathType: Exact
            backend: {service: {name: mcp-auth-server, port: {number: 8080}}}
---
# Least-privilege egress for the authorization server. It replaces the
# old bundled OAuth-server egress policy that was removed with the bundled OAuth
# server, and ships with the workload so it is applied by the same opt-in
# --with-mcp-auth-server step rather than by the unconditional platform
# manifests. SQLite is local to the pod; 8443 reaches the bundled Keycloak
# HTTPS Service and 443 reaches an external OIDC provider when configured.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-auth-server-egress
  namespace: mcp-platform
spec:
  podSelector:
    matchLabels:
      app: mcp-auth-server
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# Without this, any pod in the cluster can reach the authorization server
# directly and set X-Forwarded-Proto: https itself, which would make
# MCP_AUTH_TRUST_PROXY_TLS a statement the cluster does not actually enforce.
# Restricting ingress to the controller is what makes that setting true.
#
# Both namespaces are listed because the ingress controller is repo-managed
# Traefik in `traefik` on Kind and k3s's own Traefik in `kube-system`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-auth-server-ingress
  namespace: mcp-platform
spec:
  podSelector:
    matchLabels:
      app: mcp-auth-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
