apiVersion: v1
kind: Service
metadata:
  name: oauth-example-go-2025-11-25-gateway
  namespace: mcp-servers
spec:
  selector:
    app: oauth-example-go-2025-11-25-gateway
  ports:
    - name: http
      port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-example-go-2025-11-25-gateway
  namespace: mcp-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-example-go-2025-11-25-gateway
  template:
    metadata:
      labels:
        app: oauth-example-go-2025-11-25-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: oauth-example-go-2025-11-25:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8090"
        - name: mcp-gateway
          image: mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: UPSTREAM_URL
              value: "http://127.0.0.1:8090"
            - name: MCP_SERVER_NAME
              value: "oauth-example-go-2025-11-25-gateway"
            - name: MCP_SERVER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STRIP_PREFIX
              value: "/mcp-auto"
            - name: POLICY_MODE
              value: "observe"
            - name: OTEL_SERVICE_NAME
              value: oauth-example-go-2025-11-25-gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.mcp-observability.svc:4318"
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
