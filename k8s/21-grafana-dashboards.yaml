apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mcp-observability
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: MCP Runtime
        orgId: 1
        folder: MCP Runtime
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
  mcp-server.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(mcp_gateway_requests_total{namespace=\"$namespace\",server=\"$server\",server_uid=\"$server_uid\",rpc_method=\"tools/call\"}[1h]))",
              "refId": "A",
              "range": true
            }
          ],
          "title": "tools/call rate \u00b7 1h",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(mcp_gateway_policy_decisions_total{namespace=\"$namespace\",server=\"$server\",server_uid=\"$server_uid\",decision=\"deny\"}[1h]))",
              "refId": "A",
              "range": true
            }
          ],
          "title": "Policy denies \u00b7 1h",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(mcp_gateway_request_duration_seconds_bucket{namespace=\"$namespace\",server=\"$server\",server_uid=\"$server_uid\",rpc_method=\"tools/call\"}[1h])))",
              "refId": "A",
              "range": true
            }
          ],
          "title": "tools/call p95 \u00b7 1h",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 5,
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(mcp_gateway_requests_total{namespace=\"$namespace\",server=\"$server\",server_uid=\"$server_uid\",rpc_method=\"tools/call\",decision=\"allow\",status=~\"5..\"}[1h]))",
              "refId": "A",
              "range": true
            }
          ],
          "title": "Upstream 5xx rate \u00b7 1h",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "mcp-runtime"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "",
              "value": ""
            },
            "label": "Namespace",
            "name": "namespace",
            "options": [],
            "query": "",
            "type": "textbox"
          },
          {
            "current": {
              "selected": true,
              "text": "",
              "value": ""
            },
            "label": "Server",
            "name": "server",
            "options": [],
            "query": "",
            "type": "textbox"
          },
          {
            "current": {
              "selected": true,
              "text": "",
              "value": ""
            },
            "hide": 2,
            "name": "server_uid",
            "options": [],
            "query": "",
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "MCP Server",
      "uid": "mcp-server",
      "version": 1
    }
  scrape-coverage.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "id": 112,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 78},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "min": 0, "max": 1}},
          "targets": [{"expr": "mcp_resource_collection_success", "legendFormat": "All sources collected", "refId": "A"}, {"expr": "mcp_resource_node_collection_success", "legendFormat": "{{node}}", "refId": "B"}],
          "title": "Resource collection success (missing differs from zero)", "type": "timeseries"
        },
        {
          "id": 100,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 30},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "short"}},
          "targets": [{"expr": "mcp_resource_node_cpu_cores", "legendFormat": "{{node}}", "refId": "A"}],
          "title": "Measured node CPU (cores)", "type": "timeseries"
        },
        {
          "id": 101,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 30},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "mcp_resource_node_working_set_bytes", "legendFormat": "{{node}}", "refId": "A"}],
          "title": "Measured node working memory", "type": "timeseries"
        },
        {
          "id": 102,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "short"}},
          "targets": [{"expr": "sum by(namespace,pod)(mcp_resource_container_cpu_cores)", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}],
          "title": "Measured container CPU by pod", "type": "timeseries"
        },
        {
          "id": 103,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "sum by(namespace,pod)(mcp_resource_container_working_set_bytes)", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}],
          "title": "Measured container working memory", "type": "timeseries"
        },
        {
          "id": 104,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 46},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "mcp_resource_node_filesystem_used_bytes", "legendFormat": "{{node}} consumed", "refId": "A"}, {"expr": "mcp_resource_node_filesystem_capacity_bytes", "legendFormat": "{{node}} filesystem capacity", "refId": "B"}],
          "title": "Actual node filesystem bytes", "type": "timeseries"
        },
        {
          "id": 105,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 46},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "mcp_resource_volume_used_bytes", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}", "refId": "A"}],
          "title": "Actual PVC bytes (driver statistics required)", "type": "timeseries"
        },
        {
          "id": 106,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 54},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "short"}},
          "targets": [{"expr": "sum(mcp_resource_pod_cpu_requests_cores)", "legendFormat": "Requested cores (not consumption)", "refId": "A"}, {"expr": "sum(mcp_resource_container_cpu_cores)", "legendFormat": "Measured container cores", "refId": "B"}],
          "title": "CPU requests and measured usage", "type": "timeseries"
        },
        {
          "id": 107,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 54},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "mcp_resource_pvc_requested_bytes", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} requested", "refId": "A"}, {"expr": "mcp_resource_pvc_capacity_bytes", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} provisioned", "refId": "B"}],
          "title": "PVC reservations and capacity (not consumed bytes)", "type": "timeseries"
        },
        {
          "id": 108,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 62},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "short"}},
          "targets": [{"expr": "max_over_time(mcp_resource_node_cpu_cores[$__range])", "legendFormat": "{{node}}", "refId": "A", "instant": true}],
          "title": "Selected-window CPU peaks (startup/load samples)", "type": "stat"
        },
        {
          "id": 109,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 62},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "bytes"}},
          "targets": [{"expr": "max_over_time(mcp_resource_node_working_set_bytes[$__range])", "legendFormat": "{{node}}", "refId": "A", "instant": true}],
          "title": "Selected-window working-memory peaks", "type": "stat"
        },
        {
          "id": 110,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 70},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "Bps"}},
          "targets": [{"expr": "rate(mcp_resource_node_network_receive_bytes_total[2m])", "legendFormat": "{{node}} received", "refId": "A"}, {"expr": "rate(mcp_resource_node_network_transmit_bytes_total[2m])", "legendFormat": "{{node}} transmitted", "refId": "B"}],
          "title": "Measured node network throughput", "type": "timeseries"
        },
        {
          "id": 111,
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 70},
          "fieldConfig": {"defaults": {"noValue": "Unavailable", "unit": "s"}},
          "targets": [{"expr": "mcp_resource_collection_duration_seconds", "legendFormat": "Collection wall time", "refId": "A"}],
          "title": "Resource collection overhead (30-second cadence)", "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "expr": "mcp:scrape_required_target:info unless on (job) up",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "title": "Required targets absent (no series: discovery lost)",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "expr": "up{job=~\"mcp-platform-api|mcp-runtime-api|mcp-analytics-api|mcp-ingest|mcp-processor|clickhouse|prometheus|otel-collector|loki|tempo|promtail\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "title": "Required targets down (0) or up (1)",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "expr": "mcp:scrape_uninstrumented_workload:info",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "title": "Intentionally uninstrumented workloads",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "count(up{job=\"mcp-gateway-sidecars\"} == 1) or vector(0)",
              "legendFormat": "gateway targets up",
              "refId": "A"
            },
            {
              "expr": "sum(rate(mcp_gateway_requests_total[5m])) or vector(0)",
              "legendFormat": "requests/sec",
              "refId": "B"
            }
          ],
          "title": "Gateway sidecar targets vs traffic (up with zero traffic is healthy)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(mcp_gateway_oauth_outcomes_total{outcome!=\"success\"}[5m]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ],
          "title": "OAuth failures by outcome",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(mcp_gateway_oauth_outcomes_total{outcome=\"success\"}[5m])) or vector(0)",
              "legendFormat": "success/sec",
              "refId": "A"
            }
          ],
          "title": "OAuth success rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "sum(increase(mcp_gateway_analytics_drop_total[5m])) or vector(0)",
              "legendFormat": "dropped",
              "refId": "A"
            }
          ],
          "title": "Analytics events dropped by gateways",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate({__name__=~\"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?|promtail_dropped_entries(_total)?|loki_discarded_samples(_total)?|tempo_discarded_spans(_total)?\"}[5m]))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Collector export failures and drops",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "mcp-runtime"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Scrape Coverage",
      "uid": "scrape-coverage",
      "version": 1
    }
