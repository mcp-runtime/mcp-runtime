apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mcp-observability
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mcp-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:10.2.3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard-files
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: grafana-storage
              mountPath: /var/lib/grafana
          env:
            # Authentication is supplied only by the scoped runtime proxy.
            - name: GF_AUTH_PROXY_ENABLED
              value: "false" # setup enables only with verified policy enforcement
            - name: GF_AUTH_PROXY_HEADER_NAME
              value: "X-WEBAUTH-USER"
            - name: GF_AUTH_PROXY_HEADERS
              value: "Role:X-WEBAUTH-ROLE"
            - name: GF_AUTH_PROXY_SYNC_TTL
              value: "0"
            - name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "false"
            - name: GF_AUTH_BASIC_ENABLED
              # Keep pod-local ops/doctor credential recovery available. The
              # browser proxy discards Basic auth; NetworkPolicy blocks bypass.
              value: "true"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: "Viewer"
            # Grafana 10.2 permits read-only Explore for viewers with this flag.
            # The runtime boundary still rejects ad-hoc and cross-scope queries.
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "false"
            - name: GF_SECURITY_CONTENT_SECURITY_POLICY
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-credentials
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-grafana-credentials
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboard-provider.yaml
                path: dashboard-provider.yaml
        - name: dashboard-files
          configMap:
            name: grafana-dashboards
            items:
              - key: mcp-server.json
                path: mcp-server.json
              - key: scrape-coverage.json
                path: scrape-coverage.json
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: mcp-observability
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
