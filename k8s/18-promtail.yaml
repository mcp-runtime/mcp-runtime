apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: mcp-log-collector
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-node-log-collector
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: mcp-log-collector
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: mcp-log-collector
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.mcp-observability.svc:3100/loki/api/v1/push
    # -config.expand-env is on: write literal dollar signs as $$.
    scrape_configs:
      # Kubernetes metadata for every namespace (mcp-servers and dynamic team
      # namespaces included). Promtail only tails files on its own node, so
      # discovery is limited to local pods.
      #
      # HOSTNAME must be the node name (set from spec.nodeName in the
      # DaemonSet): Promtail compares the __host__ label against HOSTNAME and
      # derives its own pod-role spec.nodeName selector from it. Left at its
      # default (the Promtail pod name), that selector matches no pods and
      # discovery silently produces no streams.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                field: spec.nodeName=${HOSTNAME}
        pipeline_stages:
          # Parse the CRI envelope so the event timestamp is the container's
          # and the JSON body stays intact for structured queries.
          - cri: {}
          # Redact bearer/basic credentials and secret-looking JSON fields
          # before they reach Loki.
          - replace:
              expression: '(?i)(authorization["'':= ]+(?:bearer|basic)\s+)([A-Za-z0-9._~+/=-]+)'
              replace: '$${1}[REDACTED]'
          - replace:
              expression: '(?i)("(?:access_token|refresh_token|id_token|client_secret|password|api_key|apikey|token)"\s*:\s*")[^"]*(")'
              replace: '$${1}[REDACTED]$${2}'
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: (Succeeded|Failed)
          - source_labels: [__meta_kubernetes_pod_uid]
            action: drop
            regex: ""
          # Stable application identity: the operator sets app=<MCPServer name>;
          # fall back to the common recommended label, then the pod controller.
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [app, __meta_kubernetes_pod_label_app_kubernetes_io_name]
            separator: ";"
            regex: ";(.+)"
            target_label: app
            replacement: "$$1"
          - source_labels: [app, __meta_kubernetes_pod_controller_name]
            separator: ";"
            regex: ";(.+)"
            target_label: app
            replacement: "$$1"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          # CRI log layout (containerd, k3s, Kind):
          # /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
          - action: replace
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: mcp-log-collector
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          args: ["-config.file=/etc/promtail/promtail.yaml", "-config.expand-env=true"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: positions
              mountPath: /run/promtail
            - name: podlogs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        # Only pod logs are mounted; host system logs stay out of the collector.
        - name: podlogs
          hostPath:
            path: /var/log/pods
            type: Directory
