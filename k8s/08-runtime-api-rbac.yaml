apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-runtime-api
  namespace: mcp-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-runtime-api
rules:
  # Authenticated external adapters submit CSRs; the API can create and read
  # only cert-manager CertificateRequests, never private-key Secrets. It only
  # creates a request and polls that one by name, so list/watch (which would
  # expose every team's CSRs) are intentionally not granted. Pair this with a
  # workload-issuer approval policy before enabling adapter certificates; see
  # docs/connect-clients.md.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create", "get"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpaccessgrants", "mcpagentsessions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpaccessgrants", "mcpagentsessions"]
    verbs: ["create", "update", "delete"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpaccessgrants"]
    verbs: ["patch"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpagentsessions"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["mcp-runtime-api-team-secrets", "mcp-runtime-operator-managed-secrets", "mcp-runtime-operator-managed-workloads"]
    verbs: ["bind"]
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["mcpruntime.org"]
    resources: ["mcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-runtime-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-runtime-api
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
---
# Enrollment preflight reads configuration and route metadata, never CA keys.
# This separate role is also shipped by `mcp-runtime update`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-runtime-api-adapter-preflight
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "tlsoptions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-runtime-api-adapter-preflight
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-runtime-api-adapter-preflight
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-runtime-api-adapter-operator
  namespace: mcp-runtime
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mcp-runtime-operator-controller-manager"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-runtime-api-adapter-operator
  namespace: mcp-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-runtime-api-adapter-operator
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-platform-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-runtime-api
subjects:
  - kind: Group
    name: platform:role:admin
    apiGroup: rbac.authorization.k8s.io
---
# Resource history reads the narrow kubelet stats subresource directly over
# verified TLS. Never grant nodes/proxy, which also exposes execution APIs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-runtime-resource-history
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-runtime-resource-history
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-runtime-resource-history
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-runtime-api-registry-push
  namespace: mcp-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-runtime-api-registry-push
  namespace: mcp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-runtime-api-registry-push
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-runtime-api-team-secrets
rules:
  # Namespace-bound access includes cleanup of exclusively owned server
  # credentials during retirement; this role is never bound cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Bound only inside managed namespaces. These read permissions let the API
  # create Traefik watch Roles without Kubernetes RBAC escalation permission.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-runtime-api-user-key-secret
  namespace: mcp-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-user-api-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-runtime-api-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-runtime-api-user-key-secret
  namespace: mcp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-runtime-api-user-key-secret
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform

---
# Native-auth helpers mount the publisher Secret in the trusted registry namespace.
# Image archives remain in mcp-platform and are fetched over the one-shot transfer route.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-runtime-api-registry-push
  namespace: registry
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-runtime-api-registry-push
  namespace: registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-runtime-api-registry-push
subjects:
  - kind: ServiceAccount
    name: mcp-runtime-api
    namespace: mcp-platform
