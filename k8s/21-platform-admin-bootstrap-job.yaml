apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-platform-admin-bootstrap
  namespace: mcp-platform
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mcp-platform-admin-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: mcp-platform-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: mcp-shared-config
          env:
            - name: PLATFORM_ADMIN_BOOTSTRAP_ONLY
              value: "true"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: mcp-platform-api-credentials
                  key: POSTGRES_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-platform-api-credentials
                  key: JWT_SECRET
            - name: PLATFORM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mcp-platform-api-credentials
                  key: PLATFORM_ADMIN_EMAIL
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-platform-api-credentials
                  key: PLATFORM_ADMIN_PASSWORD
