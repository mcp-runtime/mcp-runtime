apiVersion: v1
kind: Service
metadata:
  name: mcp-processor
  namespace: mcp-observability
spec:
  selector:
    app: mcp-processor
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-processor
  namespace: mcp-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp-processor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-processor
  namespace: mcp-observability
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-processor
  template:
    metadata:
      labels:
        app: mcp-processor
    spec:
      priorityClassName: mcp-shared-services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: processor
          image: mcp-processor:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9102
          envFrom:
            - configMapRef:
                name: mcp-shared-config
          env:
            - name: METRICS_PORT
              value: "9102"
            - name: OTEL_SERVICE_NAME
              value: mcp-processor
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 9102
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 20
