apiVersion: v1
kind: Service
metadata:
  name: mcp-sentinel-ingest
  namespace: mcp-sentinel
spec:
  selector:
    app: mcp-sentinel-ingest
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-sentinel-ingest
  namespace: mcp-sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp-sentinel-ingest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sentinel-ingest
  namespace: mcp-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-sentinel-ingest
  template:
    metadata:
      labels:
        app: mcp-sentinel-ingest
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: mcp-sentinel-ingest:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: mcp-sentinel-config
          env:
            - name: PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9091"
            - name: INGEST_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: mcp-ingest-credentials
                  key: INGEST_API_KEYS
            - name: OTEL_SERVICE_NAME
              value: mcp-sentinel-ingest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
