apiVersion: v1
kind: Service
metadata:
  name: mcp-ingest
  namespace: mcp-observability
spec:
  selector:
    app: mcp-ingest
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-ingest
  namespace: mcp-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp-ingest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ingest
  namespace: mcp-observability
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mcp-ingest
  template:
    metadata:
      labels:
        app: mcp-ingest
    spec:
      priorityClassName: mcp-shared-services
      automountServiceAccountToken: false
      # KAFKA_BROKERS is kafka.mcp-observability.svc.cluster.local (4 dots). With
      # the default ndots:5, the resolver first tries every search domain
      # (A and AAAA each, and the Go resolver has no cache), including
      # node-inherited domains that CoreDNS forwards upstream, before the
      # absolute name. ndots:3 resolves cluster FQDNs directly while names
      # with fewer dots, such as otel-collector.mcp-observability.svc, still
      # use the search path.
      dnsConfig:
        options:
          - name: ndots
            value: "3"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: mcp-ingest:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: mcp-shared-config
          env:
            - name: PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9091"
            - name: INGEST_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: mcp-ingest-credentials
                  key: INGEST_API_KEYS
            - name: OTEL_SERVICE_NAME
              value: mcp-ingest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /live
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            # /ready answers from a cached background Kafka check, so it does
            # not wait on DNS or a dial; keep headroom for CPU throttling.
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
