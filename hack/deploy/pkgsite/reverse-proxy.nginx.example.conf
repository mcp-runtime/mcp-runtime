# Example for a host-level Nginx proxy. Add the equivalent host rule to the
# same public proxy that already serves docs.mcpruntime.org if it is not Nginx.
# The pkgsite container publishes host port 8083; MkDocs uses 8081 and articles
# uses 8082.
server {
    listen 80;
    server_name docs.pkg.mcpruntime.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.pkg.mcpruntime.org;

    ssl_certificate /etc/letsencrypt/live/docs.pkg.mcpruntime.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.pkg.mcpruntime.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
