openapi: 3.1.0
info:
  title: MCP Runtime Platform API
  version: 1.0.0
paths:
  /internal/operations/counts:
    get:
      description: Internal bearer-authenticated complete platform directory/session totals for the runtime administrator overview.
      responses:
        "200":
          description: Counts from one database snapshot, independent of list pagination.
          content:
            application/json:
              schema:
                type: object
                required: [teams, users, agents, active_sessions]
                properties:
                  teams: {type: integer, minimum: 0}
                  users: {type: integer, minimum: 0}
                  agents: {type: integer, minimum: 0}
                  active_sessions: {type: integer, minimum: 0}
        "401": {description: Internal bearer authentication required}
        "503": {description: Directory or session data unavailable}
  /api/v1/users/{user_id}/deactivate:
    post:
      summary: Administrator permanently deactivates an account and revokes stored access
      description: Atomically tombstones the account and memberships, revokes API keys, registry credentials, refresh tokens and human MCP sessions, and saves an audit record. Identity/audit history and deployed resources remain. Repeated requests are idempotent. Self-deactivation, the last active administrator and a team's last active owner are protected. Session changes follow the existing gateway sync/stale-window contract; issued registry bearers retain their normal expiry. Any cleanup/audit failure rolls back all changes.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Committed non-secret cleanup result; zero counters on an already-clean account.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, status, already_deactivated, revoked_api_keys, revoked_registry_credentials, revoked_refresh_tokens, revoked_sessions, removed_memberships]
                properties:
                  user_id: {type: string, format: uuid}
                  status: {type: string, const: deactivated}
                  already_deactivated: {type: boolean}
                  revoked_api_keys: {type: integer, minimum: 0}
                  revoked_registry_credentials: {type: integer, minimum: 0}
                  revoked_refresh_tokens: {type: integer, minimum: 0}
                  revoked_sessions: {type: integer, minimum: 0}
                  removed_memberships: {type: integer, minimum: 0}
        "400": {description: Invalid user ID}
        "401": {description: Authentication required}
        "403": {description: Active administrator required}
        "404": {description: User not found}
        "409": {description: Transfer ownership or administrator authority before cleanup}
        "500": {description: Cleanup was not confirmed; retry idempotently to resolve an uncertain commit outcome.}
  /api/v1/registry/token:
    get:
      summary: Exchange registry credentials for a five-minute scoped bearer
      parameters:
        - in: query
          name: service
          required: true
          schema: {type: string, enum: [mcp-runtime-registry]}
        - in: query
          name: scope
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
      responses:
        "200":
          description: Scoped token; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                required: [token, access_token, expires_in, issued_at]
                properties:
                  token: {type: string}
                  access_token: {type: string}
                  expires_in: {type: integer, const: 300}
                  issued_at: {type: string, format: date-time}
        "400": {description: Invalid service or scope}
        "401": {description: Authentication required}
        "403": {description: Requested repository action denied}
        "503": {description: Credential store or signer unavailable}
  /api/v1/registry/pull-credentials:
    post:
      summary: Administrator creates a namespace-bound read-only node credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace]
              additionalProperties: false
              properties:
                namespace: {type: string}
                repositories: {type: array, maxItems: 128, items: {type: string}}
      responses:
        "201":
          description: Credential returned once; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  username: {type: string}
                  password: {type: string}
                  expires_at: {type: string, format: date-time}
        "400": {description: Invalid namespace or repositories}
        "401": {description: Authentication required}
        "403": {description: Administrator required}
        "503": {description: Credential store unavailable}
    delete:
      summary: Administrator revokes a node credential
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
      responses:
        "204": {description: Revoked; existing bearers expire within five minutes}
        "400": {description: Invalid credential ID}
        "401": {description: Authentication required}
        "403": {description: Administrator required}
        "404": {description: Credential not found}
        "503": {description: Credential store unavailable}
  /health:
    get:
      responses:
        "200":
          description: service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /ready:
    get:
      responses:
        "200":
