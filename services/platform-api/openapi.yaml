          description: "Session not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        409:
          description: "Session identity conflicts or server retired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        503:
          description: "Session store unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security: [{"GatewayToken": []}]
components:
  securitySchemes:
    ControlPlaneToken: {type: http, scheme: bearer, description: Shared internal token for trusted control-plane services}
    GatewayToken: {type: http, scheme: bearer, description: Pod-bound projected service-account token with mcp-runtime-gateway audience}
  schemas:
    PersistedSession:
      type: "object"
      required: ["id", "namespace", "server_namespace", "server_name", "server_uid", "binding", "created_at"]
      properties:
        id:
          type: "string"
        uid:
          type: "string"
        namespace:
          type: "string"
        server_namespace:
          type: "string"
        server_name:
          type: "string"
        server_uid:
          type: "string"
        grant_namespace:
          type: "string"
        grant_name:
          type: "string"
        authority_team_id:
          type: "string"
        revocation_cause:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        revoked_at:
          type: "string"
          format: "date-time"
        binding:
          type: "object"
          required: ["name"]
          properties:
            name:
              type: "string"
            namespace:
              type: "string"
            human_id:
              type: "string"
            agent_id:
              type: "string"
            team_id:
              type: "string"
            consented_trust:
              type: "string"
            expires_at:
              type: "string"
            policy_version:
              type: "string"
            upstream_token_ref:
              type: "string"
            revoked:
              type: "boolean"
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        annotations:
          type: "object"
          additionalProperties:
            type: "string"
    SessionPage:
      type: "object"
      required: ["sessions"]
      properties:
        sessions:
          type: "array"
          items:
            $ref: "#/components/schemas/PersistedSession"
        next_cursor:
          type: "string"
    SessionSnapshot:
      type: "object"
      required: ["epoch", "sequence", "sessions"]
      properties:
        epoch:
          type: "string"
        sequence:
          type: "integer"
        sessions:
          type: "array"
          items:
            $ref: "#/components/schemas/PersistedSession"
    SessionChange:
      type: "object"
      required: ["kind", "sequence", "operation", "id"]
      properties:
        kind:
          type: "string"
          enum: ["session"]
        sequence:
          type: "integer"
        operation:
          type: "string"
          enum: ["upsert", "delete"]
        id:
          type: "string"
        session:
          $ref: "#/components/schemas/PersistedSession"
    SessionChanges:
      type: "object"
      required: ["epoch", "sequence", "changes", "more"]
      properties:
        epoch:
          type: "string"
        sequence:
          type: "integer"
        changes:
          type: "array"
          items:
            $ref: "#/components/schemas/SessionChange"
        more:
          type: "boolean"
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    HealthOK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
