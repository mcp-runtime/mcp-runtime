openapi: 3.1.0
info:
  title: MCP Runtime Analytics API
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        "200":
          description: service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /ready:
    get:
      responses:
        "200":
          description: dependencies ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
        "503":
          description: dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/openapi.yaml:
    get:
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/stats:
    get:
      responses:
        "200":
          description: aggregate stats
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/events:
    get:
      summary: Query audit events (admin only)
      description: Exact access-object attribution and time filters are applied before pagination. Attribution namespace identifies the matched object, separately from the server namespace. Events without explicit matched attribution are excluded from those filters. Actor and resource team fields always derive from the authoritative payload, including before optional ClickHouse projections are initialized by setup; ordinary image updates need no schema change for these reads.
      parameters:
        - in: query
          name: subject_team_id
          description: Exact caller/actor team ID; independent of the server's resource authority.
          schema: {type: string, maxLength: 256}
        - in: query
          name: resource_team_id
          description: Exact server/resource authority team ID. Legacy events use their existing team_id value; caller team remains unknown when absent.
          schema: {type: string, maxLength: 256}
        - in: query
          name: team_id
          description: Existing resource authority filter, retaining its original meaning.
          schema: {type: string}
        - in: query
          name: matched_grant
          description: Exact payload matched_grant name; requires matched_grant_namespace.
          schema: {type: string, maxLength: 256}
        - in: query
          name: matched_grant_namespace
          description: Exact namespace of the matched grant; requires matched_grant.
          schema: {type: string, maxLength: 256}
        - in: query
          name: matched_session
          description: Exact payload matched_session name; requires matched_session_namespace.
          schema: {type: string, maxLength: 256}
        - in: query
          name: matched_session_namespace
          description: Exact namespace of the matched session; requires matched_session.
          schema: {type: string, maxLength: 256}
        - in: query
          name: since
          description: Inclusive RFC3339 lower timestamp bound. Attribution or explicit time filters default to seven days before until. The maximum window is 365 days.
          schema: {type: string, format: date-time}
        - in: query
          name: until
          description: Exclusive RFC3339 upper timestamp bound, defaulting to now for attribution or time filters; must be later than since.
          schema: {type: string, format: date-time}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - in: query
          name: cursor
          description: Opaque pagination cursor from the previous response. Keep the same filters while paging.
          schema: {type: string}
      responses:
        "200":
          description: event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "400":
          description: invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/analytics/usage:
    get:
      summary: Query platform-wide MCP gateway usage (admin only)
      parameters:
        - in: query
          name: agent_id
          description: Exact agent ID, intersected with all other filters and echoed in filters.agent_id.
          schema: {type: string, maxLength: 256}
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: window_days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - in: query
          name: window_hours
          description: Overrides window_days; useful for ranges under one day.
          schema: { type: integer, minimum: 1, maximum: 8760 }
        - in: query
          name: scope
          description: Restrict to a catalog scope or team-owned namespaces.
          schema: { type: string, enum: [public, org, tenant] }
        - in: query
          name: namespace
          schema: { type: string, maxLength: 256 }
        - in: query
          name: team_id
          schema: { type: string, maxLength: 256 }
        - in: query
          name: server
          schema: { type: string, maxLength: 256 }
        - in: query
          name: rpc_method
          description: MCP JSON-RPC method, such as tools/call or tools/list.
          schema: { type: string, maxLength: 256 }
        - in: query
          name: tool_name
          schema: { type: string, maxLength: 256 }
        - in: query
          name: decision
          schema: { type: string }
        - in: query
          name: policy_version
          schema: { type: string, maxLength: 256 }
        - in: query
          name: http_status
          description: Filter by HTTP status class.
          schema: { type: string, enum: [2xx, 4xx, 5xx] }
      responses:
        "200":
          description: Gateway usage rollups, request groups, filters and time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          description: Invalid filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/user/analytics/usage:
    get:
      parameters:
        - in: query
          name: agent_id
          description: Exact agent ID. Narrows the caller's authorized namespace/resource-team scope; never grants access to another team.
          schema: {type: string, maxLength: 256}
        - in: query
          name: rpc_method
          schema: {type: string, maxLength: 256}
        - in: query
          name: window_hours
          schema: {type: integer, minimum: 1, maximum: 8760}
      responses:
        "200":
          description: user usage
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    AuditEvent:
      type: object
      properties:
        timestamp: {type: string, format: date-time}
        trace_id: {type: string}
        team_id: {type: string, description: Existing server/resource authority team ID.}
        subject_team_id: {type: string, description: Caller team; absent when the event did not identify its actor team.}
        resource_team_id: {type: string, description: Server authority team; falls back to legacy team_id when explicit attribution is absent.}
        namespace: {type: string, description: Server/resource namespace.}
        payload: {}
    UsageResponse:
      type: object
      properties:
        totals:
          type: object
          description: Request, caller, latency, HTTP failure and byte totals for the selected filters.
        requests:
          type: array
          description: Top request groups, separated by server, namespace, method, tool, decision and policy version.
          items:
            type: object
            properties:
              server: { type: string }
              namespace: { type: string }
              team_id: { type: string }
              rpc_method: { type: string }
              tool_name: { type: string }
              decision: { type: string }
              policy_version: { type: string }
              events: { type: integer, format: int64 }
              http_failures: { type: integer, format: int64 }
              p95_latency_ms: { type: number }
              last_seen: { type: string, format: date-time }
              trace_id: { type: string, description: "Latest trace ID in the request group, when available." }
        facets:
          type: object
          description: Distinct server, method, tool and policy version choices for the current time and scope.
        series:
          type: array
          items:
            type: object
            properties:
              bucket: { type: string, format: date-time }
              events: { type: integer, format: int64 }
              requests_per_second: { type: number }
        bucket_seconds: { type: integer }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    HealthOK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
