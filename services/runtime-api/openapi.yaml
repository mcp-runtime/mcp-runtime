openapi: 3.1.0
info:
  title: MCP Runtime Control API
  version: 1.0.0
paths:
  /api/v1/runtime/workspace/teams:
    get:
      description: Actual memberships of the resolved signed-in principal, including administrators. No user or namespace override is accepted.
      responses:
        "200":
          description: Personal team memberships with id, slug, name, namespace and member/owner role.
          content:
            application/json:
              schema: {type: object, required: [teams], properties: {teams: {type: array, items: {type: object}}}}
        "401": {description: Unauthorized}
  /api/v1/runtime/workspace/servers:
    get:
      description: Server catalog visibility and management authority are separate. Administrator visibility is platform-wide and does not establish personal ownership or deployment attribution.
      responses:
        "200":
          description: Complete visible server summaries. can_manage is derived by the server from management authorization. Historical deployment attribution is unavailable; ownership labels never supply a deployment actor.
          content:
            application/json:
              schema:
                type: object
                required: [servers, deployment_attribution]
                properties:
                  deployment_attribution: {type: string, enum: [unavailable]}
                  servers:
                    type: array
                    items:
                      type: object
                      required: [name, namespace, status, can_manage]
                      properties:
                        name: {type: string}
                        namespace: {type: string}
                        status: {type: string}
                        can_manage: {type: boolean}
        "401": {description: Unauthorized}
        "503": {description: Catalog unavailable; never reported as an empty successful read.}
  /api/v1/runtime/workspace/access:
    get:
      description: Grants for the current human or their actual team memberships, excluding agent-specific grants; sessions must name the current human. Administrator authority does not expand this personal view. Unknown or historical deployment actors are never inferred.
      responses:
        "200":
          description: Scoped grants and sessions, including disabled/revoked status and expiry.
          content:
            application/json:
              schema: {type: object, required: [grants, sessions], properties: {grants: {type: array, items: {type: object}}, sessions: {type: array, items: {type: object}}}}
        "401": {description: Unauthorized}
        "503": {description: Access state unavailable}
  /api/v1/admin/overview/directory:
    get:
      description: Administrator-only complete platform counts from a single database snapshot. Counts exclude deleted teams/users; agents include current teams; active sessions exclude revoked, expired, retired-server and inactive-agent sessions.
      responses:
        "200":
          description: Authoritative platform totals, independent of operations pagination.
          content:
            application/json:
              schema:
                type: object
                required: [teams, users, agents, active_sessions]
                properties:
                  teams: {type: integer, minimum: 0}
                  users: {type: integer, minimum: 0}
                  agents: {type: integer, minimum: 0}
                  active_sessions: {type: integer, minimum: 0}
        "401": {description: Unauthorized}
        "403": {description: Administrator role required}
        "503": {description: Counts unavailable; unknown values are not zero.}
  /api/v1/admin/overview/servers:
    get:
      description: Administrator-only complete MCPServer count and deployment failures. Missing Kubernetes/CRD access fails the request rather than returning partial totals.
      responses:
        "200":
          description: Platform server totals and failed deployment references.
          content:
            application/json:
              schema: {type: object, required: [servers, failures], properties: {servers: {type: integer, minimum: 0}, failures: {type: array, items: {type: object}}}}
        "401": {description: Unauthorized}
        "403": {description: Administrator role required}
        "503": {description: Server counts unavailable}
  /api/v1/runtime/observability/grafana/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Grafana subpath reached through the platform UI session proxy.
    get:
      summary: Read Grafana through the authenticated runtime boundary
      description: >-
        Every request reauthenticates the platform principal. Tenant access
        requires completed scoped Grafana setup and admits only the provisioned
        MCP Server dashboard, frontend assets and selected read metadata.
        Datasource proxy/resource, Live, snapshots, rendering and unknown routes
        are denied. Admins retain unfiltered access.
      responses:
        '200':
          description: Grafana content for an allowed route
        '401':
          description: Authentication required
        '403':
          description: Route not available or scoped setup incomplete
    post:
      summary: Execute fixed authorized Grafana queries
      description: >-
        Tenants may POST only to the api/ds/query subpath, with at most twenty
        Prometheus query models. Every expression must exactly match one of
        runtime-api's fixed queries for a currently observable MCPServer and
        its current immutable UID. All batch targets are reauthorized before
        any shared datasource request. Arbitrary PromQL and other datasource
        models are denied. The cookie-backed UI path additionally requires an
        exact configured public Origin; direct API callers use bearer/API-key
        authentication. Admins retain unfiltered query access.
      responses:
        '200':
          description: Grafana query results
        '400':
          description: Invalid query body
        '401':
          description: Authentication required
        '403':
          description: Query or server scope not allowed
  /health:
    get:
      responses:
        "200":
          description: service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /ready:
    get:
      responses:
        "200":
          description: dependencies ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
        "503":
          description: dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/openapi.yaml:
    get:
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/runtime/delegation-recipients:
    get:
      description: Resolve one known recipient team for a resource namespace manager without exposing global directory listings.
      parameters:
        - {name: namespace, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 63}}
        - {name: team, in: query, required: true, description: Exact recipient team slug, schema: {type: string, minLength: 1, maxLength: 63}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: agent_cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: member_cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        "200":
          description: Minimal recipient identities, with independent pagination for active agents and member IDs.
          content:
            application/json:
              schema:
                type: object
                required: [team, agents, members]
                properties:
                  team:
                    type: object
                    required: [id, slug, name]
                    properties:
                      id: {type: string}
                      slug: {type: string}
                      name: {type: string}
                  agents:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        status: {type: string, const: active}
                        team_id: {type: string}
                        team_slug: {type: string}
                  members:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [user_id]
                      properties:
                        user_id: {type: string}
                  agent_next_cursor: {type: string}
                  member_next_cursor: {type: string}
        "400":
          description: Invalid exact-team query, limit, or cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: Resource namespace management required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "404":
          description: Exact recipient team not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "503":
          description: Recipient directory unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /api/v1/runtime/servers:
    get:
      responses:
        "200":
          description: server inventory
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/runtime/tools:
    get:
      responses:
        "200":
          description: tool inventory
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/runtime/teams/{team}/agents:
    get:
      summary: List agents owned by a team
      parameters:
        - in: path
          name: team
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Bounded page of agents visible to the caller. Members see only agents with applicable access or their own active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPage" }
        "401":
          description: unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      summary: Create an agent for a team
      parameters:
        - in: path
          name: team
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema: { type: object, properties: { agent: { $ref: "#/components/schemas/Agent" } } }
        "403":
          description: admin or team owner required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/runtime/agents/{id}:
    get:
      summary: Get a scoped agent detail with applicable grants and sessions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent, caller-visible grants and sessions, and management authority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "404":
          description: agent not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    patch:
      summary: Rename a team agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Renamed agent
          content:
            application/json:
              schema: { type: object, properties: { agent: { $ref: "#/components/schemas/Agent" } } }
  /api/v1/runtime/agents/{id}/deactivate:
    post:
      summary: Deactivate an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Inactive agent
          content:
            application/json:
              schema: { type: object, properties: { agent: { $ref: "#/components/schemas/Agent" } } }
  /api/v1/runtime/agents/{id}/reactivate:
    post:
      summary: Reactivate an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active agent
          content:
            application/json:
              schema: { type: object, properties: { agent: { $ref: "#/components/schemas/Agent" } } }
  /internal/auth/resolve:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: string
      responses:
        "200":
          description: resolved principal
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    HealthOK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Agent:
      type: object
      required: [id, team_id, team_slug, name, status, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^agt_[0-9a-hjkmnp-tv-z]{26}$' }
        team_id: { type: string }
        team_slug: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [active, inactive] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deactivated_at: { type: string, format: date-time }
        deactivated_by: { type: string }
    AgentPage:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        next_cursor: { type: string }
    AgentDetail:
      type: object
      required: [agent, grants, sessions, can_manage]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        grants:
          type: array
          items: { type: object, description: Caller-visible MCPAccessGrant summary }
        sessions:
          type: array
          items: { type: object, description: Caller-visible MCPAgentSession summary }
        can_manage: { type: boolean }
        certificates_error: {type: string, description: Independent history failure; agent identity and access remain available.}
        certificates:
          type: object
          description: Recorded certificate issuance in the last seven days, within caller visibility. Recording starts with 0.12.0; missing historical records cannot be counted.
          required: [recorded, since, until, recent]
          properties:
            recorded: {type: integer, minimum: 0}
            since: {type: string, format: date-time}
            until: {type: string, format: date-time}
            recent:
              type: array
              maxItems: 100
              items:
                type: object
                properties:
                  namespace: {type: string}
                  session: {type: string}
                  server: {type: string}
                  human_id: {type: string}
                  serial: {type: string}
                  fingerprint_sha256: {type: string}
                  spiffe_id: {type: string}
                  not_before: {type: string, format: date-time}
                  not_after: {type: string, format: date-time}
                  issued_at: {type: string, format: date-time}
