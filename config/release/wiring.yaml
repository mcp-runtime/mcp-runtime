# Non-image Deployment configuration, ServiceAccounts/RBAC, NetworkPolicies and ConfigMaps a
# release requires, embedded in platform-manifest.json so `mcp-runtime update`
# can apply them without a full setup. Everything here must match the
# corresponding object in k8s/ or config/rbac/; tests enforce that.
#
# update adds or corrects exactly the declared objects, keys and fields; other
# env, flags and ConfigMap keys are untouched. Releases opt objects in
# explicitly: list one here when the release changes it.

# ServiceAccount/RBAC and supported platform NetworkPolicy objects, as "<Kind>/<namespace>/<name>" (namespaced) or
# "<Kind>/<name>" (cluster-scoped). Validated: no wildcard or escalating rules.
platformObjects:
  # The updater refuses these policies until supported setup migrated Grafana.
  - NetworkPolicy/mcp-observability/mcp-scoped-observability-ingress
  - NetworkPolicy/mcp-platform/mcp-runtime-api-grafana-egress
  - NetworkPolicy/mcp-observability/kafka-client-ingress
  - NetworkPolicy/mcp-platform/mcp-runtime-api-resource-history-egress
  - ServiceAccount/mcp-observability/prometheus
  - ClusterRole/mcp-prometheus-discovery
  - ClusterRoleBinding/mcp-prometheus-discovery
  - ServiceAccount/mcp-runtime/mcp-runtime-operator-controller-manager
  - ClusterRole/mcp-runtime-operator-role
  - ClusterRole/mcp-runtime-operator-managed-secrets
  - ClusterRole/mcp-runtime-operator-managed-workloads
  - ClusterRoleBinding/mcp-runtime-operator-rolebinding
  - RoleBinding/mcp-servers/mcp-runtime-operator-managed-secrets
  - RoleBinding/mcp-servers/mcp-runtime-operator-managed-workloads
  - Role/mcp-platform/mcp-runtime-operator-bundled-auth
  - RoleBinding/mcp-platform/mcp-runtime-operator-bundled-auth
  - ServiceAccount/mcp-observability/mcp-ingest
  - ClusterRole/mcp-ingest-tokenreview
  - ClusterRoleBinding/mcp-ingest-tokenreview
  - ClusterRole/mcp-runtime-api-team-secrets
  - ClusterRole/mcp-runtime-resource-history
  - ClusterRoleBinding/mcp-runtime-resource-history
  - ClusterRole/mcp-runtime-api-adapter-preflight
  - ClusterRoleBinding/mcp-runtime-api-adapter-preflight
  - Role/mcp-runtime/mcp-runtime-api-adapter-operator
  - RoleBinding/mcp-runtime/mcp-runtime-api-adapter-operator
  - ClusterRole/mcp-platform-gateway-ingressclass
  - Role/mcp-platform/mcp-platform-gateway
  - Role/mcp-observability/mcp-platform-gateway

# ConfigMaps whose data the release owns. restart lists the components that
# read the ConfigMap only at start; they are rolled when it changes.
configMaps:
  - key: mcp-observability/prometheus-config
    restart: [prometheus]
  - key: mcp-observability/grafana-datasources
    restart: [grafana]
  - key: mcp-observability/grafana-dashboards
    restart: [grafana]

# Third-party workloads whose image pin is taken from their k8s/ Deployment.
thirdPartyImages:
  - gateway

# Third-party workloads whose image the release leaves alone but whose wiring
# or ConfigMap-driven restarts update applies.
configOnly:
  - prometheus
  - grafana

components:
  ingest:
    serviceAccountName: mcp-ingest
    automountServiceAccountToken: true
    env:
      INGEST_SA_TOKEN_AUDIENCE: mcp-ingest
  gateway:
    args:
      - --tracing.serviceName=traefik-platform
      - --tracing.sampleRate=1
      - --tracing.otlp.http.endpoint=http://otel-collector.mcp-observability.svc.cluster.local:4318/v1/traces
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
  prometheus:
    serviceAccountName: prometheus
    automountServiceAccountToken: true
    resourceHistoryToken: true
    args:
      - --enable-feature=exemplar-storage
  platform-api:
    dnsOptions:
      - name: ndots
        value: "3"
  runtime-api:
    dnsOptions:
      - name: ndots
        value: "3"
  analytics-api:
    dnsOptions:
      - name: ndots
        value: "3"
  ui:
    dnsOptions:
      - name: ndots
        value: "3"
