# Traefik base enables HTTP to HTTPS, which breaks HTTP-01 ACME challenges
# (Let's Encrypt). Use plain HTTP; HTTPS remains on the secure entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  template:
    spec:
      # Mirrors config/ingress/base/traefik.yaml so this patch is hardened on
      # its own (scanners evaluate patch files standalone); the rendered
      # result is unchanged.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=registry,mcp-platform,mcp-observability,mcp-log-collector,mcp-servers,mcp-servers-org,mcp-servers-public
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --entrypoints.websecure.http.tls=true
            - --ping=true
            - --providers.file.filename=/etc/traefik/dynamic/dynamic.yml
            - --providers.file.watch=true
