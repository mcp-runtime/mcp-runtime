apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: traefik
data:
  dynamic.yml: |
    http:
      middlewares:
        runtime-token-exchange:
          forwardAuth:
            address: http://mcp-platform-api.mcp-platform.svc.cluster.local:8080/internal/auth/exchange/runtime
            trustForwardHeader: false
            forwardBody: false
            authRequestHeaders:
              - Authorization
              - X-Api-Key
            authResponseHeaders:
              - Authorization
              - X-Api-Key
        analytics-token-exchange:
          forwardAuth:
            address: http://mcp-platform-api.mcp-platform.svc.cluster.local:8080/internal/auth/exchange/analytics
            trustForwardHeader: false
            forwardBody: false
            authRequestHeaders:
              - Authorization
              - X-Api-Key
            authResponseHeaders:
              - Authorization
              - X-Api-Key
        registry-admin-auth:
          forwardAuth:
            # Post api-service-split cutover: mcp-platform-api.mcp-platform.svc.cluster.local:8080
            address: http://mcp-platform-api.mcp-platform.svc.cluster.local:8080/api/v1/registry/authz
            trustForwardHeader: false
        platform-admin-auth:
          forwardAuth:
            address: http://mcp-ui.mcp-platform.svc.cluster.local:8082/auth/admin-check
            trustForwardHeader: true
