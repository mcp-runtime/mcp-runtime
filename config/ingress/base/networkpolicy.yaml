apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-default-deny
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-allow-ingress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app: traefik
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-allow-egress
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app: traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Platform backends only. Egress to MCPServer backends is not listed here:
    # the operator manages one narrow NetworkPolicy per MCPServer in this
    # namespace (labelled mcpruntime.org/component=traefik-egress) that allows
    # only that server's pods on the port its Service routes to.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-observability
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8091
    # Traefik watches Ingress and TLS Secret objects through the Kubernetes API.
    # CNIs can evaluate egress after Service DNAT, against the endpoint port.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
