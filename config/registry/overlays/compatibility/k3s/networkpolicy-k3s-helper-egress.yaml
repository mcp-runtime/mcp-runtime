# k3s compatibility: bundled with config/registry/overlays/compatibility/k3s.
# k3s runs Traefik in kube-system. Native registry authentication helpers may
# reach the public token realm through it when the platform host hairpins.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-push-helper-egress-k3s
  namespace: registry
  labels:
    platform.mcpruntime.org/compatibility: k3s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: registry-push-helper
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 443
