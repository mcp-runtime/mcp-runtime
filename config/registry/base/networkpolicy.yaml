apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-default-deny
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-allow-ingress
  namespace: registry
spec:
  podSelector:
    matchLabels:
      app: registry
  policyTypes:
    - Ingress
  ingress:
    # Tenant workload namespaces (mcp-servers*, platform-managed team
    # namespaces) are intentionally absent: the internal registry has no
    # registry-native auth, and node image pulls come from the kubelet, not
    # from tenant pods. Only platform control-plane callers may reach it.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-runtime
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-allow-egress
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: registry
      ports:
        - protocol: TCP
          port: 5000
