---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: mcpservers.mcpruntime.org
spec:
  group: mcpruntime.org
  names:
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.teamID
      name: Team
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.policyReady
      name: Policy
      type: boolean
    - jsonPath: .status.gatewayReady
      name: Gateway
      type: boolean
    - jsonPath: .status.deploymentReady
      name: Ready
      type: boolean
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPServer is the Schema for the mcpservers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPServerSpec defines the desired state of MCPServer.
            properties:
              analytics:
                description: |-
                  Analytics configures audit/analytics emission for the gateway sidecar.
                  When the gateway is enabled and this field is omitted, analytics emission
                  is on whenever the operator has a default ingest URL. Set
                  analytics.disabled to true to opt out. If set without an ingest URL, the
                  operator may supply its configured default ingest URL.
                properties:
                  apiKeySecretRef:
                    description: APIKeySecretRef points to a secret key containing
                      the analytics API key.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  disabled:
                    description: |-
                      Disabled suppresses analytics emission from the gateway sidecar for this
                      server.
                    type: boolean
                  eventType:
                    description: EventType is the event type label attached to emitted
                      analytics events.
                    type: string
                  ingestURL:
                    description: |-
                      IngestURL is the analytics ingest endpoint. If empty, the operator may
                      supply its configured default ingest URL.
                    type: string
                  source:
                    description: Source is the event source label attached to emitted
                      analytics events.
                    type: string
                type: object
              auth:
                description: Auth enables optional OAuth authentication at the gateway
                  when present.
                properties:
                  audience:
                    description: |-
                      Audience is the OAuth resource identifier tokens must be issued for and
                      that protected-resource metadata advertises. When
                      this is unset, it defaults to the public MCP URL built from the ingress
                      host (or MCP_DEFAULT_INGRESS_HOST on the operator), TLS setting, and path.
                    type: string
                  credentialPresence:
                    description: |-
                      CredentialPresence is "any" (default: at least one configured header)
                      or "all" (every configured header). The gateway forwards every present
                      configured header and does not choose among them.
                    enum:
                    - any
                    - all
                    type: string
                  headers:
                    description: |-
                      Headers are customer-configured credential header names. Credential
                      values never belong here. Names match case-insensitively.
                    items:
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                  issuerURL:
                    type: string
                  mode:
                    description: |-
                      Mode selects authentication. Omit it for OAuth. "header" delegates
                      credential authentication to the upstream MCP server.
                    enum:
                    - header
                    type: string
                  scopes:
                    description: |-
                      Scopes are the OAuth scopes this MCP resource permits clients to request.
                      The bundled authorization server publishes and enforces them per resource.
                    items:
                      type: string
                    type: array
                  tokenHeader:
                    type: string
                type: object
              description:
                description: Description is a human-readable summary of what the MCP
                  server provides.
                type: string
              envVars:
                description: EnvVars are literal environment variables to pass to
                  the container.
                items:
                  description: EnvVar represents a literal environment variable.
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
              gateway:
                description: |-
                  Gateway configures the MCP proxy sidecar in front of the server container.
                  When omitted or left empty, the sidecar is enabled so metrics, traces, and
                  analytics can run. Set gateway.enabled to false to opt out.
                properties:
                  enabled:
                    description: |-
                      Enabled turns the gateway sidecar on or off. When nil/omitted the sidecar
                      is enabled (observability by default). Set to false to opt out.
                    type: boolean
                  image:
                    description: Image overrides the proxy container image for this
                      server.
                    type: string
                  port:
                    description: Port is the port the gateway listens on inside the
                      pod (defaults to 8091).
                    format: int32
                    type: integer
                  resources:
                    description: Resources defines resource limits and requests for
                      the gateway sidecar.
                    properties:
                      limits:
                        description: ResourceList defines CPU and memory resources.
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                        type: object
                      requests:
                        description: ResourceList defines CPU and memory resources.
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                        type: object
                    type: object
                  stripPrefix:
                    description: StripPrefix removes a path prefix before forwarding
                      to the upstream server.
                    type: string
                  upstreamURL:
                    description: |-
                      UpstreamURL is the upstream URL the gateway proxies to.
                      Defaults to http://127.0.0.1:<spec.port>.
                    type: string
                type: object
              image:
                description: Image is the container image for the MCP server.
                type: string
              imagePullSecrets:
                description: ImagePullSecrets are secrets to use for pulling the image.
                items:
                  type: string
                type: array
              imageTag:
                description: ImageTag is the tag of the container image (defaults
                  to "latest").
                type: string
              ingressAnnotations:
                additionalProperties:
                  type: string
                description: IngressAnnotations are additional annotations for the
                  ingress controller.
                type: object
              ingressClass:
                description: IngressClass is the ingress class to use (e.g., "traefik",
                  "nginx", "istio"). Defaults to "traefik".
                type: string
              ingressHost:
                description: IngressHost is the hostname for the ingress (required
                  unless publicPathPrefix is set; defaults from MCP_DEFAULT_INGRESS_HOST
                  env var if set on the operator).
                type: string
              ingressPath:
                description: IngressPath is the path for the ingress route (defaults
                  to /{name}/mcp).
                type: string
              mcpResources:
                description: MCPResources describes the MCP resource inventory exposed
                  by the server.
                items:
                  description: InventoryItem describes a named MCP prompt, resource,
                    or task.
                  properties:
                    description:
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              policy:
                description: |-
                  Policy configures gateway-side authorization behavior. When omitted, the
                  gateway runs in observe mode so metrics and analytics work without
                  grant/session enforcement. Set this field (for example allow-list + deny)
                  to require adapter identity and grants.
                properties:
                  defaultDecision:
                    enum:
                    - allow
                    - deny
                    type: string
                  delegatedToolRules:
                    description: |-
                      DelegatedToolRules apply only when auth.mode is header. An explicit
                      deny wins over no rule; unlisted tools follow defaultDecision, which
                      header mode requires to be deny.
                    items:
                      description: |-
                        DelegatedToolRule allows or denies one tool when auth.mode is header.
                        These rules do not identify the caller.
                      properties:
                        decision:
                          allOf:
                          - enum:
                            - allow
                            - deny
                          - enum:
                            - allow
                            - deny
                          type: string
                        name:
                          type: string
                      required:
                      - decision
                      - name
                      type: object
                    type: array
                  enforceOn:
                    type: string
                  maxSideEffect:
                    allOf:
                    - enum:
                      - read
                      - write
                      - destructive
                    - enum:
                      - read
                      - write
                      - destructive
                    description: MaxSideEffect caps header-mode tool calls at this
                      class or lower.
                    type: string
                  mode:
                    enum:
                    - allow-list
                    - observe
                    type: string
                  policyVersion:
                    type: string
                type: object
              port:
                description: Port is the port the container listens on (defaults to
                  8088).
                format: int32
                type: integer
              prompts:
                description: Prompts describes the MCP prompt inventory exposed by
                  the server.
                items:
                  description: InventoryItem describes a named MCP prompt, resource,
                    or task.
                  properties:
                    description:
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              publicPathPrefix:
                description: |-
                  PublicPathPrefix enables path-based public routing and is used to compute /<publicPathPrefix>/mcp.
                  When ingressHost is also set, the route is path-based under that host; otherwise it is hostless.
                type: string
              registryOverride:
                description: RegistryOverride, if set, overrides the registry portion
                  of the image (e.g., registry.mcpruntime.com).
                type: string
              replicas:
                description: Replicas is the number of desired replicas (defaults
                  to 1).
                format: int32
                type: integer
              resources:
                description: Resources defines resource limits and requests.
                properties:
                  limits:
                    description: ResourceList defines CPU and memory resources.
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                  requests:
                    description: ResourceList defines CPU and memory resources.
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                type: object
              rollout:
                description: Rollout configures deployment rollout behavior for this
                  server.
                properties:
                  canaryReplicas:
                    format: int32
                    type: integer
                  maxSurge:
                    type: string
                  maxUnavailable:
                    type: string
                  strategy:
                    enum:
                    - RollingUpdate
                    - Recreate
                    - Canary
                    type: string
                type: object
              secretEnvVars:
                description: SecretEnvVars are secret-backed environment variables
                  to pass to the container.
                items:
                  description: SecretEnvVar represents a secret-backed environment
                    variable.
                  properties:
                    name:
                      type: string
                    secretKeyRef:
                      description: SecretKeyRef points to a single key in a Kubernetes
                        Secret.
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - name
                  type: object
                type: array
              servicePort:
                description: ServicePort is the port exposed by the service (defaults
                  to 80).
                format: int32
                type: integer
              session:
                description: Session configures server-side agent session behavior.
                properties:
                  idleTimeout:
                    type: string
                  maxLifetime:
                    type: string
                  required:
                    type: boolean
                  store:
                    type: string
                  upstreamTokenHeader:
                    type: string
                type: object
              tasks:
                description: Tasks describes task templates or workflows exposed by
                  the server.
                items:
                  description: InventoryItem describes a named MCP prompt, resource,
                    or task.
                  properties:
                    description:
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              teamID:
                description: |-
                  TeamID is the stable platform team identifier that owns this server.
                  The operator renders it into gateway policy and analytics events.
                type: string
              tools:
                description: Tools describes the MCP tool inventory exposed by the
                  server.
                items:
                  description: ToolConfig describes one MCP tool exposed by a server.
                  properties:
                    description:
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      type: string
                    requiredTrust:
                      enum:
                      - low
                      - medium
                      - high
                      type: string
                    riskLevel:
                      enum:
                      - low
                      - medium
                      - high
                      type: string
                    sideEffect:
                      enum:
                      - read
                      - write
                      - destructive
                      type: string
                  required:
                  - name
                  - sideEffect
                  type: object
                type: array
              useProvisionedRegistry:
                description: UseProvisionedRegistry tells the controller to use the
                  provisioned registry (from operator env) for this server.
                type: boolean
            required:
            - image
            type: object
          status:
            description: MCPServerStatus defines the observed state of MCPServer.
            properties:
              canaryReady:
                description: CanaryReady indicates if the canary deployment, when
                  configured, is ready.
                type: boolean
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deploymentReady:
                description: DeploymentReady indicates if the deployment is ready.
                type: boolean
              gatewayReady:
                description: GatewayReady indicates if the gateway configuration and
                  sidecar are ready.
                type: boolean
              ingressReady:
                description: IngressReady indicates if the ingress is ready.
                type: boolean
              message:
                description: Message provides additional information about the status.
                type: string
              phase:
                description: Phase represents the current phase of the MCPServer.
                type: string
              policyReady:
                description: PolicyReady indicates if policy data for the gateway
                  has been generated.
                type: boolean
              serviceReady:
                description: ServiceReady indicates if the service is ready.
                type: boolean
              url:
                description: |-
                  URL is the public MCP endpoint the operator derived from the ingress
                  host, TLS setting, and public path. The platform API, CLI, and UI show
                  this value instead of rebuilding it, so every surface agrees with what
                  the ingress and gateway actually serve. Empty when no host is known.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
