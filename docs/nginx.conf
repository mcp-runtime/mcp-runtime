worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name docs.mcpruntime.org _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        error_page 404 /404.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /README.md {
            return 301 /;
        }

        location = /README/ {
            return 301 /;
        }

        location ~ ^/(.+)/README\.md$ {
            return 301 /$1/;
        }

        location ~ ^/(.+)/README/?$ {
            return 301 /$1/;
        }

        # Preserve published links after descriptive source-file renames.
        location ~ ^/getting\-started(?:/?|\.md|/index\.html)$ {
            return 301 /self-hosting/$is_args$args;
        }

        location ~ ^/quickstart(?:/?|\.md|/index\.html)$ {
            return 301 /hosted-quickstart/$is_args$args;
        }

        location ~ ^/cli(?:/?|\.md|/index\.html)$ {
            return 301 /cli-reference/$is_args$args;
        }

        location ~ ^/api(?:/?|\.md|/index\.html)$ {
            return 301 /api-reference/$is_args$args;
        }

        location ~ ^/concepts(?:/?|\.md|/index\.html)$ {
            return 301 /core-concepts/$is_args$args;
        }

        location ~ ^/runtime(?:/?|\.md|/index\.html)$ {
            return 301 /runtime-operations/$is_args$args;
        }

        location ~ ^/agent\-adapters(?:/?|\.md|/index\.html)$ {
            return 301 /connect-clients/$is_args$args;
        }

        location ~ ^/multi\-team(?:/?|\.md|/index\.html)$ {
            return 301 /teams-and-access/$is_args$args;
        }

        location ~ ^/mcp\-authorization(?:/?|\.md|/index\.html)$ {
            return 301 /mcp-oauth/$is_args$args;
        }

        location ~ ^/internals/cmd\-mcp\-runtime(?:/?|\.md|/index\.html)$ {
            return 301 /internals/cli-entrypoint/$is_args$args;
        }

        location ~ ^/internals/cmd\-operator(?:/?|\.md|/index\.html)$ {
            return 301 /internals/operator/$is_args$args;
        }

        location ~ ^/internals/internal\-cli(?:/?|\.md|/index\.html)$ {
            return 301 /internals/cli/$is_args$args;
        }

        location ~ ^/internals/pkg\-metadata(?:/?|\.md|/index\.html)$ {
            return 301 /internals/metadata/$is_args$args;
        }

        location ~ ^/internals/tests(?:/?|\.md|/index\.html)$ {
            return 301 /internals/testing/$is_args$args;
        }

        location ~ ^/learn/module\-1\-concepts(?:/?|\.md|/index\.html)$ {
            return 301 /learn/01-core-concepts/$is_args$args;
        }

        location ~ ^/learn/module\-2\-first\-server(?:/?|\.md|/index\.html)$ {
            return 301 /learn/02-first-governed-server/$is_args$args;
        }

        location ~ ^/learn/module\-3\-multi\-team(?:/?|\.md|/index\.html)$ {
            return 301 /learn/03-multi-team-access/$is_args$args;
        }

        location ~ ^/(.+)\.md$ {
            return 301 /$1/;
        }

        location = /404.html {
            internal;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "interest-cohort=()" always;
            try_files $uri =404;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "interest-cohort=()" always;
            try_files $uri =404;
        }

        location ~* \.(?:json|xml|txt)$ {
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "interest-cohort=()" always;
            try_files $uri =404;
        }
    }
}
