  - id: "71"
    title: Make sentinel messaging stack durable and self-healing across node restarts
    protected_behavior: Restart/eviction/dependency recovery without data loss or manual destructive repair.
    status: untested
    waiver:
      owner: Agent-Hellboy
      follow_up: "https://github.com/mcp-runtime/mcp-runtime/issues/546"
      expires: "2026-12-31"
      blocker: Existing coverage has not been inventoried.
