site_name: MCP Runtime Docs
site_url: https://docs.mcpruntime.org/
repo_url: https://github.com/mcp-runtime/mcp-runtime
repo_name: mcp-runtime/mcp-runtime
edit_uri: edit/main/docs/
docs_dir: .
site_dir: ../site
validation:
  links:
    anchors: warn
exclude_docs: |
  .dockerignore
  Dockerfile
  mkdocs.yml
  nginx.conf
  requirements.txt
  site/
  overrides/
theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/mcp-runtime-logo-dark.png
  favicon: assets/brand/mcp-runtime-icon.png
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    scheme: default
    primary: black
    accent: blue
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js
  - js/mermaid-init.js?v=20260526-4

extra_css:
  - stylesheets/infra.css
nav:
  - Home: README.md
  - Start Here:
      - Hosted Quickstart: hosted-quickstart.md
      - Self-Host MCP Runtime: self-hosting.md
      - Guided Tutorials: learn/README.md
      - "Module 1: Core Concepts": learn/01-core-concepts.md
      - "Module 2: Your First Server": learn/02-first-governed-server.md
      - "Module 3: Multi-Team Setup": learn/03-multi-team-access.md
  - Use MCP Runtime:
      - Publish an MCP Server: publish-mcp-server.md
      - Connect an MCP Client: connect-clients.md
      - Configure MCP OAuth: mcp-oauth.md
      - Manage Teams and Isolation: teams-and-access.md
  - Self-Host and Operate:
      - Overview: hosting-overview.md
      - Choose a Deployment Target: deployment-targets.md
      - Prepare Your Cluster: cluster-readiness.md
      - Cluster Provisioning: cluster-provisioning.md
      - Public Reference Deployment: reference-deployment.md
      - Runtime Operations: runtime-operations.md
      - Namespaces: namespaces.md
      - Platform Services and Observability: platform-services.md
      - Troubleshooting: troubleshooting.md
  - Concepts and Architecture:
      - Core Concepts: core-concepts.md
      - Identity and Authorization: identity-and-authorization.md
      - Architecture: architecture.md
  - Reference:
      - CLI: cli-reference.md
      - API: api-reference.md
      - API Authn/Authz Matrix: security/authz-matrix.md
      - Go Packages: https://docs.pkg.mcpruntime.org/github.com/mcp-runtime/mcp-runtime
  - Contributor Guide:
      - Overview: contributor/README.md
      - Local Kind and Test Mode: contributor/local-kind.md
      - Service Iteration: contributor/service-iteration.md
      - Runtime MCP Testing: contributor/runtime-mcp-testing.md
      - Staging E2E: contributor/staging-e2e.md
      - Regression Index: contributor/regression-index.md
      - Troubleshooting: contributor/troubleshooting.md
  - Internals:
      - Overview: internals/README.md
      - API Types: internals/api-types.md
      - Request Flows: internals/request-flows.md
      - Go Package Reference: internals/go-package-reference.md
      - Hosting Go Package Docs: internals/pkgsite.md
      - CLI Internals: internals/cli.md
      - Operator Internals: internals/operator.md
      - Component Inventory: internals/component-inventory.md
      - Runtime CLI Cmd: internals/cli-entrypoint.md
      - Metadata Package: internals/metadata.md
      - Config and Examples: internals/config-and-examples.md
      - Gateway and Platform Inspirations: internals/gateway-platform-inspirations.md
      - Credential Consumers: internals/credential-consumers.md
      - Dependency Rollouts: internals/dependency-rollouts.md
      - Log Collector Admission: internals/log-collector-admission.md
      - Operator Secret Access: internals/operator-secret-access.md
      - Tests: internals/testing.md
