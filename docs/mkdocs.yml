site_name: MCP Runtime Docs
site_url: https://docs.mcpruntime.org/
repo_url: https://github.com/mcp-runtime/mcp-runtime
repo_name: mcp-runtime/mcp-runtime
edit_uri: edit/main/docs/
docs_dir: .
site_dir: ../site
validation:
  links:
    anchors: warn
exclude_docs: |
  .dockerignore
  Dockerfile
  mkdocs.yml
  nginx.conf
  requirements.txt
  site/
  overrides/
theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/mcp-runtime-logo-dark.png
  favicon: assets/brand/mcp-runtime-icon.png
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    scheme: default
    primary: black
    accent: blue
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js
  - js/mermaid-init.js?v=20260526-4

extra_css:
  - stylesheets/infra.css
nav:
  - Home: README.md
  - Getting Started:
      - Overview: start-here.md
      - Hosted Quickstart: hosted-quickstart.md
      - Guided Tutorials:
          - Overview: learn/README.md
          - Core Concepts: learn/01-core-concepts.md
          - First Governed Server: learn/02-first-governed-server.md
          - Multi-Team Access: learn/03-multi-team-access.md
  - Server and Client Guides:
      - Overview: usage-overview.md
      - Server Publishing: publish-mcp-server.md
      - Teams and Access: teams-and-access.md
      - Client Connections: connect-clients.md
      - MCP OAuth: mcp-oauth.md
  - Deployment and Operations:
      - Overview: hosting-overview.md
      - Installation:
          - Deployment Options: deployment-targets.md
          - Cluster Requirements: cluster-readiness.md
          - Platform Installation: self-hosting.md
      - Public Reference:
          - Cluster Provisioning: cluster-provisioning.md
          - Deployment Guide: reference-deployment.md
      - Operations:
          - Runtime Operations: runtime-operations.md
          - Namespaces: namespaces.md
          - Services and Observability: platform-services.md
          - Troubleshooting: troubleshooting.md
  - Concepts and Architecture:
      - Overview: concepts-overview.md
      - Core Concepts: core-concepts.md
      - Identity and Authorization: identity-and-authorization.md
      - Architecture: architecture.md
  - CLI and API Reference:
      - Overview: reference-overview.md
      - CLI Commands: cli-reference.md
      - API and Resources: api-reference.md
      - Authentication and Authorization: security/authz-matrix.md
      - Go Packages: https://docs.pkg.mcpruntime.org/github.com/mcp-runtime/mcp-runtime
  - Development and Testing:
      - Overview: contributor/README.md
      - Local Development:
          - Cluster Setup: contributor/local-kind.md
          - Service Iteration: contributor/service-iteration.md
          - Troubleshooting: contributor/troubleshooting.md
      - Verification:
          - MCP Runtime Tests: contributor/runtime-mcp-testing.md
          - Staging End-to-End Tests: contributor/staging-e2e.md
          - Regression Coverage: contributor/regression-index.md
  - Implementation Details:
      - Overview: internals/README.md
      - Contracts and Flows:
          - API Types: internals/api-types.md
          - Request Flows: internals/request-flows.md
          - Server Metadata: internals/metadata.md
          - Configuration and Examples: internals/config-and-examples.md
      - Components:
          - CLI Entrypoint: internals/cli-entrypoint.md
          - CLI Implementation: internals/cli.md
          - Operator: internals/operator.md
          - Component Inventory: internals/component-inventory.md
      - Security and Lifecycle:
          - Credential Ownership: internals/credential-consumers.md
          - Operator Secret Access: internals/operator-secret-access.md
          - Dependency Rollouts: internals/dependency-rollouts.md
          - Log Collector Admission: internals/log-collector-admission.md
      - Developer References:
          - Go Package Reference: internals/go-package-reference.md
          - Package Docs Hosting: internals/pkgsite.md
          - Design Background: internals/gateway-platform-inspirations.md
          - Tests and Coverage: internals/testing.md
