version: v1
servers:
    - name: onepassword-credential-demo
      description: "Credential gateway: validate the saved upstream Login before OAuth, then inject upstream MCP headers. Public fixtures only."
      image: registry.mcpruntime.org/public/onepassword-credential-demo
      imageTag: login-first-review
      route: /onepassword-credential-demo/mcp
      publicPathPrefix: onepassword-credential-demo
      port: 8088
      replicas: 1
      resources:
        limits:
            cpu: 250m
            memory: 128Mi
        requests:
            cpu: 25m
            memory: 32Mi
      scope: public
      tools:
        - name: upstream_status
          description: Confirm that the upstream MCP server authenticated its required header.
          requiredTrust: low
          sideEffect: read
        - name: echo
          description: Echo a message after upstream header authentication.
          requiredTrust: low
          sideEffect: read
      envVars:
        - name: UPSTREAM_AUTH_CONFIG
          value: /upstream-auth.json
      auth:
        issuerURL: https://auth.mcpruntime.org/mcp-auth
        audience: https://mcp.mcpruntime.org/onepassword-credential-demo/mcp
      gateway:
        enabled: false
