version: v1
servers:
  - name: vault-header-demo
    description: Header-authenticated test upstream for the optional mcp-auth credential gateway.
    image: registry.mcpruntime.org/public/vault-header-demo
    imageTag: credential-gateway-review
    route: /vault-header-demo/mcp
    publicPathPrefix: vault-header-demo
    port: 8088
    replicas: 1
    scope: public
    auth:
      mode: header
      headers: [Authorization]
    gateway:
      enabled: false
    tools:
      - name: upstream_status
        description: Confirm upstream header authentication.
        requiredTrust: low
        sideEffect: read
      - name: echo
        description: Echo an authenticated message.
        requiredTrust: low
        sideEffect: read
